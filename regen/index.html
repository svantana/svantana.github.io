<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REGEN — 303 / 808 Sequencer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000' stroke='%23ffffff' stroke-width='2'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='17' font-weight='700' text-anchor='middle' fill='%23ffffff'%3ERG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-copy">
        <div class="brand-name">RE:GEN</div>
        <div class="brand-sub">PROCEDURAL GROOVEBOX</div>
      </div>
    </div>

    <div class="transport">
      <button id="playBtn" class="play-btn" type="button" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.1-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3C8.9 3.9 8 4.4 8 5.2z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="4.5" width="4" height="15"/><rect x="13.5" y="4.5" width="4" height="15"/></svg>
      </button>
    </div>

    <div class="control-group tempo-group">
      <span class="control-label">TEMPO</span>
      <div class="tempo-control">
        <button id="bpmDown" class="mini-btn" type="button" aria-label="Decrease tempo">−</button>
        <div class="led-box">
          <input id="bpmInput" type="number" min="60" max="200" step="1" value="124" aria-label="Tempo in beats per minute">
          <span class="led-unit">BPM</span>
        </div>
        <button id="bpmUp" class="mini-btn" type="button" aria-label="Increase tempo">+</button>
      </div>
    </div>

    <div class="control-group" id="swingKnob"></div>
    <div class="control-group" id="masterKnob"></div>

    <div class="control-group meter-group" aria-hidden="true">
      <div class="meter" id="meter">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <span class="control-label">OUT</span>
    </div>

    <div class="top-hint">
      <kbd>SPACE</kbd>
      <span>play / pause</span>
    </div>
  </header>

  <div class="app">
    <main id="tracks" class="tracks"></main>
  </div>

<script src="app.js"></script>
</body>
</html>
