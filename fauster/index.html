<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faust Editor</title>
<style>
:root{--bg:#14161a;--panel:#1c1f26;--line:#2c313c;--fg:#d8dce4;--dim:#8a91a0;--acc:#ff8a3d;--key:#e9ebf0;--keyd:#14161a}
@media (prefers-color-scheme: light){:root{--bg:#f2f3f6;--panel:#fff;--line:#d5d8e0;--fg:#1d2128;--dim:#6b7280;--acc:#e0610f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 1fr;height:100%}
#left{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}
#bar{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:var(--panel)}
button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button.run{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
#scope{flex:1;min-width:60px;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
#status{color:var(--dim);font-size:12px;white-space:nowrap}
#status.err{color:#ff5c5c}
#code{flex:1;width:100%;resize:none;border:0;outline:0;padding:12px;background:var(--bg);color:var(--fg);
 font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;tab-size:2;white-space:pre}
#err{max-height:25%;overflow:auto;margin:0;padding:8px 12px;color:#ff5c5c;font:12px ui-monospace,monospace;border-top:1px solid var(--line);display:none;white-space:pre-wrap}
#right{display:flex;flex-direction:column;min-width:0}
#gui{flex:1;overflow:auto;padding:14px}
#kbwrap{overflow:hidden;border-top:1px solid var(--line);background:var(--panel);padding:10px 12px 12px}
#kbinfo{color:var(--dim);font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}
#kb{position:relative;height:120px;user-select:none;touch-action:none}
.k{position:absolute;top:0;height:100%;border:1px solid #888;border-radius:0 0 5px 5px;background:var(--key);display:flex;align-items:flex-end;justify-content:center;
 padding-bottom:5px;font-size:11px;color:#555;cursor:pointer}
.k.b{height:62%;background:var(--keyd);color:#bbb;z-index:2;border-color:#000}
.k.m{box-shadow:inset 0 -3px 0 var(--acc)}
.k.on{background:var(--acc)!important;color:#000}
/* GUI */
.grp{border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;margin:6px;background:var(--panel);display:inline-block;vertical-align:top}
.grp>.t{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:stretch}
.w{display:flex;flex-direction:column;align-items:center;margin:4px 8px;min-width:90px;font-size:12px}
.w input[type=range]{width:110px;accent-color:var(--acc)}
.w.v input[type=range]{writing-mode:vertical-lr;direction:rtl;width:24px;height:110px}
.w .val{color:var(--dim);font-variant-numeric:tabular-nums}
.meter{width:110px;height:8px;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--acc)}
.w.v .meter{width:10px;height:110px;display:flex;align-items:flex-end}.w.v .meter i{width:100%;height:0}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="bar">
      <button class="run" id="run">▶ Compile &amp; run</button>
      <button id="stop">■ Stop</button>
      <canvas id="scope"></canvas>
      <span id="status">Ctrl/Cmd+Enter to compile</span>
    </div>
    <textarea id="code" spellcheck="false"></textarea>
    <pre id="err"></pre>
  </div>
  <div id="right">
    <div id="gui"></div>
    <div id="kbwrap">
      <div id="kbinfo"><span>Keys: a w s e d f t g y h u j k o l p &nbsp;·&nbsp; z / x = octave down / up (Esc leaves the editor)</span><span id="oct"></span></div>
      <div id="kb"></div>
    </div>
  </div>
</div>

<script type="module">
const CDN = "https://cdn.jsdelivr.net/npm/@grame/faustwasm";
const $ = s => document.querySelector(s);
const DEFAULT = `import("stdfaust.lib");

// Polyphony the standard Faust way: declare [nvoices:n] and use the standard
// freq / gain / gate parameters, which key-on / key-off events set per voice.
// https://faustdoc.grame.fr/manual/midi/#midi-polyphony-support
declare options "[midi:on][nvoices:8]";

freq   = hslider("freq", 440, 20, 5000, 0.01);
gain   = hslider("gain", 0.5, 0, 1, 0.01);
gate   = button("gate");

cutoff = hslider("[1]cutoff", 3000, 100, 10000, 1) : si.polySmooth(gate, 0.999, 1);
atk    = hslider("[2]attack", 0.01, 0.001, 1, 0.001);
rel    = hslider("[3]release", 0.3, 0.01, 2, 0.01);

env = en.adsr(atk, 0.2, 0.6, rel, gate);

// one voice (scaled down: active voices are summed without scaling)
process = os.sawtooth(freq) * gain * env : fi.lowpass(2, cutoff) : /(4);

// one effect instance shared by all voices
effect = dm.zita_light;
`;
$("#code").value = DEFAULT;

const status = (t, e) => { const s = $("#status"); s.textContent = t; s.className = e ? "err" : ""; };

// ---------- Faust ----------
let faust = null, ctx = null, node = null, analyser = null;

async function loadFaust() {
  if (faust) return faust;
  status("Loading Faust compiler…");
  const m = await import(`${CDN}/dist/esm-bundle/index.js`);
  const base = `${CDN}/libfaust-wasm/`;
  const mod = await m.instantiateFaustModuleFromFile(base + "libfaust-wasm.js", base + "libfaust-wasm.data", base + "libfaust-wasm.wasm");
  const lib = new m.LibFaust(mod);
  faust = { m, compiler: new m.FaustCompiler(lib) };
  return faust;
}

function stop() {
  if (node) { try { node.disconnect(); node.destroy?.(); } catch {} node = null; }
  cnt.clear(); held.clear(); ptr.clear(); stack.length = 0; noteEls.forEach(e => e.classList.remove("on"));
}

async function run() {
  $("#err").style.display = "none";
  try {
    const { m, compiler } = await loadFaust();
    if (!ctx) {
      ctx = new AudioContext({ latencyHint: "interactive" });
      analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
      analyser.connect(ctx.destination);
    }
    await ctx.resume();
    status("Compiling…");
    const code = $("#code").value, args = "-ftz 2";
    const mono = new m.FaustMonoDspGenerator();
    await mono.compile(compiler, "dsp", code, args);                 // also yields the metadata
    const opts = (mono.getMeta().meta || []).map(x => x.options).find(Boolean) || "";
    const nv = +(opts.match(/\[nvoices:(\d+)\]/) || [])[1] || 0;     // standard polyphony option
    stop();
    if (nv > 0) {
      const polyGen = new m.FaustPolyDspGenerator();                    // voice = process, shared effect = effect
      await polyGen.compile(compiler, "dsp", code, args);
      node = await polyGen.createNode(ctx, nv);
    } else {
      node = await mono.createNode(ctx);
    }
    if (!node) throw new Error("Could not create audio node");
    node.connect(analyser);   // node -> analyser (scope) -> speakers
    const json = JSON.parse(node.getJSON());
    mp = nv > 0 ? {} : findParams(json); stack.length = 0; poly = nv > 0;
    buildGui(json);
    status("Running");
  } catch (e) {
    const msg = String(e?.message || e);
    $("#err").textContent = msg; $("#err").style.display = "block";
    status("Error", true);
  }
}
$("#run").onclick = run;
$("#stop").onclick = () => { stop(); status("Stopped"); };
$("#code").addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
  else if (e.key === "Escape") e.target.blur();
  else if (e.key === "Tab") { e.preventDefault(); document.execCommand("insertText", false, "  "); }
});

// ---------- Oscilloscope ----------
const cv = $("#scope"), g2 = cv.getContext("2d"), buf = new Float32Array(2048);
function drawScope() {
  requestAnimationFrame(drawScope);
  const dpr = devicePixelRatio || 1, w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const css = getComputedStyle(document.documentElement);
  g2.clearRect(0, 0, w, h);
  g2.strokeStyle = css.getPropertyValue("--line"); g2.lineWidth = 1;
  g2.beginPath(); g2.moveTo(0, h / 2); g2.lineTo(w, h / 2); g2.stroke();
  g2.strokeStyle = css.getPropertyValue("--acc").trim(); g2.lineWidth = 1.5 * dpr;
  g2.beginPath();
  if (!analyser || !node) { g2.moveTo(0, h / 2); g2.lineTo(w, h / 2); g2.stroke(); return; }
  analyser.getFloatTimeDomainData(buf);
  let start = 1;                                       // rising zero-crossing trigger
  while (start < 1024 && !(buf[start - 1] < 0 && buf[start] >= 0)) start++;
  if (start >= 1024) start = 0;
  const N = 1024;
  for (let i = 0; i < N; i++) {
    const x = i / (N - 1) * w, y = h / 2 - Math.max(-1, Math.min(1, buf[start + i])) * (h / 2 - 2);
    i ? g2.lineTo(x, y) : g2.moveTo(x, y);
  }
  g2.stroke();
}
drawScope();

// ---------- GUI from the Faust JSON ----------
function buildGui(json) {
  const root = $("#gui"); root.innerHTML = "";
  const meters = {};
  node?.setOutputParamHandler((path, v) => meters[path]?.(v));
  const clean = s => (s || "").replace(/\[[^\]]*\]/g, "").trim();
  const make = (it) => {
    const t = it.type, label = clean(it.label);
    if (t.endsWith("group")) {
      const g = document.createElement("div"); g.className = "grp";
      if (label) g.innerHTML = `<div class="t">${label}</div>`;
      const c = document.createElement("div"); c.className = t === "hgroup" ? "row" : "col";
      if (t === "tgroup") c.className = "row";
      (it.items || []).forEach(i => c.appendChild(make(i)));
      g.appendChild(c); return g;
    }
    if (poly && /^(freq|key|vel|velocity|gate)$/.test((it.address || "").split("/").pop())) return document.createDocumentFragment();
    const w = document.createElement("div"); w.className = "w" + (t.startsWith("v") ? " v" : "");
    const addr = it.address, step = +it.step || 0.01;
    const dec = Math.max(0, Math.min(4, (String(step).split(".")[1] || "").length));
    if (t === "button") {
      const b = document.createElement("button"); b.textContent = label;
      const set = v => node?.setParamValue(addr, v);
      b.onpointerdown = () => set(1); b.onpointerup = b.onpointerleave = () => set(0);
      w.appendChild(b);
    } else if (t === "checkbox") {
      const l = document.createElement("label"); const c = document.createElement("input"); c.type = "checkbox";
      c.onchange = () => node?.setParamValue(addr, c.checked ? 1 : 0);
      l.append(c, " " + label); w.appendChild(l);
    } else if (t === "hslider" || t === "vslider" || t === "nentry") {
      const r = document.createElement("input"); r.type = "range";
      r.min = it.min; r.max = it.max; r.step = step; r.value = it.init;
      const v = document.createElement("span"); v.className = "val"; v.textContent = (+it.init).toFixed(dec);
      const isGain = poly && addr.split("/").pop() === "gain";
      const setVel = () => { if (isGain) vel = Math.max(1, Math.min(127, Math.round(+r.max > 0 ? (+r.value - +r.min) / (+r.max - +r.min) * 127 : 100))); };
      r.oninput = () => { v.textContent = (+r.value).toFixed(dec); node?.setParamValue(addr, +r.value); setVel(); };
      setVel();
      node?.setParamValue(addr, +it.init);
      const l = document.createElement("span"); l.textContent = label;
      w.append(l, r, v);
    } else if (t === "hbargraph" || t === "vbargraph") {
      const mt = document.createElement("div"); mt.className = "meter"; const bar = document.createElement("i"); mt.appendChild(bar);
      const vert = t === "vbargraph", lo = +it.min, hi = +it.max;
      meters[addr] = val => {
        const p = Math.max(0, Math.min(1, (val - lo) / (hi - lo))) * 100;
        bar.style[vert ? "height" : "width"] = p + "%";
      };
      const l = document.createElement("span"); l.textContent = label; w.append(l, mt);
    }
    return w;
  };
  (json.ui || []).forEach(i => root.appendChild(make(i)));
}

// ---------- Keyboard ----------
// qwerty keys map to 16 semitones starting at C of `octave`; extra (unlabelled) keys fill the width, centred around them
const KEYS = ["a","w","s","e","d","f","t","g","y","h","u","j","k","o","l","p"];
const isBlack = n => [1,3,6,8,10].includes(n % 12);
const KW = 32, BW = 19;               // white key width (capped), black key width
let octave = 4;
const base = () => (octave + 1) * 12;
const held = new Map();               // computer key -> note
const cnt = new Map();                // note -> number of things holding it (computer keys / pointers)
const noteEls = new Map();            // note -> element
const kb = $("#kb");

function drawKb() {
  kb.innerHTML = ""; noteEls.clear();
  const avail = kb.parentElement.clientWidth - 24;
  const W = Math.max(10, Math.floor(avail / KW));      // number of white keys that fit
  const b = base(), MAPPED_WHITES = 9;                 // C D E F G A B C D
  let s = b;
  for (let i = 0, left = Math.floor((W - MAPPED_WHITES) / 2); i < left; i++) { s--; while (isBlack(s)) s--; }
  while (s < 0 || isBlack(s)) s++;
  const whites = [];
  for (let n = s; n <= 127 && whites.length < W; n++) if (!isBlack(n)) whites.push(n);
  const add = (n, cls, left, width) => {
    const el = document.createElement("div");
    el.className = "k " + cls; el.style.left = left + "px"; el.style.width = width + "px"; el.dataset.n = n;
    const m = n - b;
    if (m >= 0 && m < KEYS.length) { el.classList.add("m"); el.textContent = KEYS[m].toUpperCase(); }
    if (cnt.get(n)) el.classList.add("on");
    noteEls.set(n, el); kb.appendChild(el);
  };
  whites.forEach((n, i) => add(n, "", i * KW, KW));
  whites.forEach((n, i) => { if (i < whites.length - 1 && isBlack(n + 1)) add(n + 1, "b", (i + 1) * KW - BW / 2, BW); });
  kb.style.width = whites.length * KW + "px";
  $("#oct").textContent = "Octave " + octave;
}
drawKb();
addEventListener("resize", drawKb);

// Mono voice: drive the DSP's "freq" and "gate" parameters directly (last-note priority).
// Falls back to a raw MIDI message if the DSP has no freq/gate parameters.
let mp = {};
const stack = [];
const mtof = n => 440 * 2 ** ((n - 69) / 12);
function findParams(json) {          // mono only: locate the freq / gate controls
  const out = {};
  (function walk(items) {
    for (const it of items || []) {
      if (it.items) walk(it.items);
      else if (it.address) { const b = it.address.split("/").pop(); if (b === "freq" || b === "gate") out[b] = it.address; }
    }
  })(json.ui);
  return out;
}
let poly = false, vel = 100;   // key-on velocity (in poly mode the gain slider sets it)
function noteOn(n) {
  stack.push(n);
  if (!node) return;
  if (poly) return node.keyOn(0, n, vel);                       // Faust handles voice allocation
  if (mp.freq && mp.gate) { node.setParamValue(mp.freq, mtof(n)); node.setParamValue(mp.gate, 1); }
  else node.midiMessage([0x90, n, 100]);
}
function noteOff(n) {
  const i = stack.lastIndexOf(n); if (i >= 0) stack.splice(i, 1);
  if (!node) return;
  if (poly) return node.keyOff(0, n, 0);
  if (mp.freq && mp.gate) {
    if (stack.length) node.setParamValue(mp.freq, mtof(stack[stack.length - 1]));
    else node.setParamValue(mp.gate, 0);
  } else node.midiMessage([0x80, n, 0]);
}

function press(n) {
  const c = (cnt.get(n) || 0) + 1; cnt.set(n, c);
  if (c === 1) { noteEls.get(n)?.classList.add("on"); noteOn(n); }
}
function release(n) {
  const c = cnt.get(n) || 0;
  if (c <= 0) return;
  if (c === 1) { cnt.delete(n); noteEls.get(n)?.classList.remove("on"); noteOff(n); }
  else cnt.set(n, c - 1);
}
function down(k) { if (held.has(k)) return; const n = base() + KEYS.indexOf(k); held.set(k, n); press(n); }
function up(k) { if (!held.has(k)) return; release(held.get(k)); held.delete(k); }

// Mouse/touch: press and drag across keys to slide between notes (one pointer = one note)
const ptr = new Map();   // pointerId -> note held by that pointer
const noteAt = e => {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return el && el.dataset && el.dataset.n !== undefined && kb.contains(el) ? +el.dataset.n : null;
};
const moveTo = (id, n) => {
  const prev = ptr.get(id);
  if (prev === n) return;
  if (prev !== undefined) release(prev);
  if (n !== null) { press(n); ptr.set(id, n); } else ptr.delete(id);
};
kb.addEventListener("pointerdown", e => { e.preventDefault(); kb.setPointerCapture(e.pointerId); moveTo(e.pointerId, noteAt(e)); });
kb.addEventListener("pointermove", e => {
  if (ptr.has(e.pointerId) || (e.buttons & 1 && kb.hasPointerCapture(e.pointerId))) moveTo(e.pointerId, noteAt(e));
});
const endPtr = e => { const n = ptr.get(e.pointerId); if (n !== undefined) release(n); ptr.delete(e.pointerId); };
kb.addEventListener("pointerup", endPtr);
kb.addEventListener("pointercancel", endPtr);

const typing = e => /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName) && e.target.type !== "range" && e.target.type !== "checkbox";
addEventListener("keydown", e => {
  if (typing(e) || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (KEYS.includes(k)) down(k);
  else if (k === "z" && octave > 1) { octave--; drawKb(); }
  else if (k === "x" && octave < 7) { octave++; drawKb(); }
});
addEventListener("keyup", e => { const k = e.key.toLowerCase(); if (KEYS.includes(k)) up(k); });
addEventListener("blur", () => [...held.keys()].forEach(up));
</script>
</body>
</html>
