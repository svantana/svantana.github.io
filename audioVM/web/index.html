<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <title>AudioVM Player</title>
  <script>
    // Daylight hours get the light workspace; evenings start in the darker one.
    const hour = new Date().getHours();
    document.documentElement.dataset.theme = hour >= 7 && hour < 19 ? 'light' : 'dark';
  </script>
  <style>
    :root { color-scheme:dark; --bg:#111214; --panel:#191b1f; --surface:#15171b; --surface-raised:#282c32; --editor:#14161a; --analysis:#111317; --border:#30343a; --divider:#292d33; --text:#e8eaf0; --muted:#9299a5; --subtle:#bac3cf; --gutter:#69717d; --code:#d7e5dc; --accent:#92e5b1; --accent-text:#102116; --danger:#ff8f8f; --danger-bg:#331d20; --danger-border:#67353a; --knob-bg:#282c32; --syntax-keyword:#c99bff; --syntax-string:#9ee6b4; --syntax-number:#f2c17d; --syntax-comment:#737b87; --syntax-builtin:#82caff; --syntax-function:#ffb7cf; --canvas-grid:rgba(255,255,255,.12); }
    :root[data-theme="light"] { color-scheme:light; --bg:#f4f6f8; --panel:#ffffff; --surface:#edf1f5; --surface-raised:#ffffff; --editor:#fbfcfd; --analysis:#f8fafc; --border:#cbd4de; --divider:#dbe2e9; --text:#1d2935; --muted:#5f6d7b; --subtle:#435364; --gutter:#788797; --code:#243b32; --accent:#18794e; --accent-text:#fff; --danger:#b42318; --danger-bg:#fff1f0; --danger-border:#f0b5af; --knob-bg:#fff; --syntax-keyword:#6946a8; --syntax-string:#187343; --syntax-number:#a95d08; --syntax-comment:#758291; --syntax-builtin:#176da5; --syntax-function:#ad3f61; --canvas-grid:rgba(36,51,66,.16); }
    * { box-sizing:border-box; }
    body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.4 ui-sans-serif, system-ui, sans-serif; }
    #status { min-width:0; margin-left:auto; overflow:hidden; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    button, .button-link { border:1px solid var(--border); border-radius:5px; background:var(--surface-raised); color:var(--text); padding:7px 11px; font:inherit; cursor:pointer; }
    .button-link { text-decoration:none; }
    button:hover:not(:disabled), .button-link:hover { border-color:var(--accent); }
    button:disabled { cursor:wait; opacity:.55; }
    select { max-width:180px; border:1px solid var(--border); border-radius:5px; background:var(--surface-raised); color:var(--text); padding:7px 28px 7px 9px; font:inherit; }
    select:disabled { cursor:wait; opacity:.55; }
    #play.playing { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
    main { --operator-width:168px; --editor-width:minmax(320px, 1.2fr); display:grid; grid-template-columns:var(--operator-width) 6px var(--editor-width) 6px minmax(280px, 1fr); grid-template-rows:minmax(0, 1fr); height:100vh; overflow:hidden; transition:grid-template-columns .18s ease; }
    main.resizing { transition:none; }
    main.ops-collapsed { grid-template-columns:42px 0 var(--editor-width) 6px minmax(280px, 1fr); }
    section { min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
    #operator-sidebar { grid-column:1; }
    #operator-resize { grid-column:2; }
    #editor-panel { grid-column:3; }
    #player-resize { grid-column:4; }
    #right-panel { grid-column:5; }
    .resize-handle { position:relative; z-index:2; cursor:col-resize; background:var(--border); touch-action:none; }
    .resize-handle:hover, .resize-handle.resizing { background:var(--accent); }
    .resize-handle::after { position:absolute; top:0; right:-3px; bottom:0; left:-3px; content:""; }
    main.ops-collapsed #operator-resize { visibility:hidden; pointer-events:none; }
    .section-head { display:flex; align-items:center; min-height:44px; padding:8px 14px; border-bottom:1px solid var(--border); background:var(--panel); }
    .section-head strong { font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .section-head span { margin-left:auto; color:var(--muted); font-size:12px; }
    #operator-sidebar { background:var(--surface); }
    #operator-sidebar .section-head { flex:none; padding:7px 8px; gap:7px; }
    #operator-sidebar .section-head strong { overflow:hidden; white-space:nowrap; }
    #operator-sidebar-toggle { flex:none; width:26px; height:26px; padding:0; font-size:15px; }
    #operator-sidebar-count { overflow:hidden; white-space:nowrap; }
    #operator-search { width:calc(100% - 16px); margin:8px; border:1px solid var(--border); border-radius:5px; background:var(--analysis); color:var(--text); padding:7px 8px; font:inherit; }
    #operator-list { flex:1; min-height:0; overflow:auto; padding:0 8px 12px; }
    .operator-item { border-bottom:1px solid var(--divider); }
    .operator-item summary { display:flex; align-items:center; min-height:33px; cursor:pointer; font:12px ui-monospace, monospace; list-style:none; }
    .operator-item summary::-webkit-details-marker { display:none; }
    .operator-item summary::before { width:14px; color:var(--muted); content:'›'; font:16px/1 sans-serif; }
    .operator-item[open] summary::before { content:'⌄'; }
    .operator-info { margin:0 0 8px 14px; color:var(--subtle); font:11px/1.55 ui-monospace, monospace; word-break:break-word; }
    .operator-info p { margin:0; }
    .operator-description { margin-bottom:4px !important; color:var(--subtle); font-family:ui-sans-serif, system-ui, sans-serif; }
    .operator-info-label { color:var(--muted); }
    .port-rate-block { color:var(--accent); }
    .port-rate-full { color:var(--danger); }
    .port-rate-keep { color:var(--muted); }
    .operator-empty { padding:8px 0; color:var(--muted); font-size:12px; }
    main.ops-collapsed #operator-sidebar .section-head { justify-content:center; }
    main.ops-collapsed #operator-sidebar .section-head strong, main.ops-collapsed #operator-sidebar-count, main.ops-collapsed #operator-search, main.ops-collapsed #operator-list { display:none; }
    .editor { flex:1; min-height:0; display:flex; background:var(--editor); }
    #program { flex:1; min-width:0; min-height:0; }
    .editor-toolbar { flex:none; height:69px; padding:10px 14px; display:flex; align-items:center; gap:10px; border-top:1px solid var(--border); background:var(--panel); }
    .editor-toolbar button, .editor-toolbar select { flex:none; white-space:nowrap; }
    #theme-toggle { width:30px; height:30px; padding:0; font-size:15px; line-height:1; }
    #audio-stats { display:flex; align-items:center; gap:5px; min-height:30px; padding:0 7px; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--muted); font:10px ui-monospace, monospace; white-space:nowrap; }
    #audio-stats[hidden] { display:none; }
    #cpu-load { min-width:30px; color:var(--accent); text-align:right; }
    #audio-format { padding-left:5px; border-left:1px solid var(--border); }
    #controls { flex:1; min-height:0; display:grid; grid-template-columns:repeat(auto-fit, minmax(112px, 1fr)); align-content:start; gap:10px; padding:12px 14px 28px; overflow:auto; }
    #analysis-panel { flex:none; height:164px; display:flex; border-top:1px solid var(--border); background:var(--analysis); }
    #analysis-canvas { flex:1; min-width:0; height:100%; }
    #analysis-toggles { display:flex; flex:0 0 92px; flex-direction:column; justify-content:center; gap:7px; padding:9px; border-left:1px solid var(--border); color:var(--muted); font-size:11px; }
    #analysis-toggles label { display:flex; align-items:center; gap:5px; cursor:pointer; }
    #analysis-toggles label[hidden] { display:none; }
    #analysis-toggles input { margin:0; accent-color:var(--accent); }
    #analysis-toggles select { width:100%; padding:4px 20px 4px 6px; font-size:11px; }
    #analysis-toggles select[hidden] { display:none; }
    #audio-input-bar { flex:none; min-height:58px; padding:10px 14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); background:var(--panel); }
    #audio-input-bar[hidden] { display:none; }
    #audio-input-bar label { color:var(--muted); font-size:12px; }
    #audio-input-bar select { flex:1; min-width:0; }
    #transport-bar { flex:none; min-height:58px; padding:10px 14px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); background:var(--panel); }
    #transport-bar[hidden] { display:none; }
    #transport-bar label { color:var(--muted); font-size:12px; }
    #transport-bar input { width:68px; min-width:0; border:1px solid var(--border); border-radius:5px; background:var(--surface-raised); color:var(--text); padding:6px 7px; font:inherit; }
    #transport-bar .transport-stepper { display:flex; width:82px; min-width:0; }
    #transport-bar .transport-stepper input { width:60px; border-radius:5px 0 0 5px; }
    #transport-bar .transport-stepper-buttons { display:flex; width:22px; flex-direction:column; }
    #transport-bar .transport-stepper-buttons button { height:19px; border-radius:0; padding:0; font-size:10px; line-height:1; }
    #transport-bar .transport-stepper-buttons button:first-child { border-radius:0 5px 0 0; }
    #transport-bar .transport-stepper-buttons button + button { border-top:0; border-radius:0 0 5px 0; }
    #transport-toggle.running { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
    .knob { --knob-angle:-135deg; position:relative; flex:none; width:38px; height:38px; border:2px solid var(--border); border-radius:50%; background:var(--knob-bg); cursor:ns-resize; touch-action:none; }
    .knob::after { position:absolute; top:5px; left:calc(50% - 1px); width:2px; height:13px; border-radius:1px; background:var(--accent); content:""; transform:rotate(var(--knob-angle)); transform-origin:1px 14px; }
    .knob:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .control .knob { margin:0 auto; }
    .empty { color:var(--muted); margin:8px 0; }
    #controls .empty { grid-column:1 / -1; }
    .control-group { grid-column:1 / -1; min-width:0; border:1px solid var(--border); border-radius:6px; padding:0 10px 10px; }
    .control-group h3 { margin:0; padding:8px 4px 0; color:var(--muted); font-size:12px; font-weight:600; }
    .control-group-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(112px, 1fr)); gap:10px; }
    .control { min-width:0; min-height:118px; display:grid; grid-template-rows:auto 1fr auto; place-items:center; gap:7px; padding:10px; }
    .control label { max-width:100%; font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    output { margin-left:auto; color:var(--accent); font:12px ui-monospace, monospace; }
    .control output { margin:0; }
    input[type=range] { width:100%; accent-color:var(--accent); }
    #error, #warning { display:none; margin:0; padding:9px 14px; font:12px/1.4 ui-monospace, monospace; white-space:pre-wrap; }
    #error { background:var(--danger-bg); color:var(--danger); border-top:1px solid var(--danger-border); }
    #warning { background:#302813; color:#f1c85b; border-top:1px solid #705717; }
    #right-panel:focus { outline:2px solid var(--accent); outline-offset:-2px; }
    .keyboard-panel { flex:none; height:69px; padding:0; border-top:1px solid var(--border); background:var(--panel); }
    #piano { position:relative; height:100%; display:grid; border:1px solid #090a0c; border-radius:4px; overflow:hidden; background:#e8e9e8; }
    #piano.kit { grid-auto-flow:column; grid-auto-columns:minmax(0, 1fr); background:var(--panel); }
    .piano-key { touch-action:none; user-select:none; }
    .piano-key.white { position:relative; grid-row:1; min-width:0; border:0; border-right:1px solid #8e9394; border-radius:0; background:#f5f5f1; color:transparent; padding:0; font:10px ui-monospace, monospace; }
    .key-label { position:absolute; right:0; bottom:4px; left:0; text-align:center; }
    .octave-label { position:absolute; top:4px; right:0; left:0; font-size:9px; font-weight:700; text-align:center; }
    .piano-key.white:last-of-type { border-right:0; }
    .piano-key.black { position:absolute; z-index:2; top:0; left:0; width:14px; height:60%; border:1px solid #050607; border-radius:0 0 4px 4px; background:#171a1e; color:transparent; padding:0 1px 4px; display:flex; align-items:end; justify-content:center; font:9px ui-monospace, monospace; }
    #right-panel:focus-within .piano-key.white { color:#25282b; }
    #right-panel:focus-within .piano-key.black { color:#dfe4e9; }
    .piano-key:hover { border-color:var(--accent); }
    .piano-key.active { background:var(--accent); color:#112116; border-color:var(--accent); }
    .piano-key.black.active { background:#76c995; color:#102116; }
    .piano-key.kit-pad { position:relative; grid-row:1; min-width:0; border:0; border-right:1px solid var(--border); border-radius:0; background:var(--panel); color:var(--text); padding:8px 4px; font:12px ui-monospace, monospace; }
    .piano-key.kit-pad:last-child { border-right:0; }
    .piano-key.kit-pad .key-label { display:block; margin-bottom:6px; color:var(--muted); font-size:10px; }
    .piano-key.kit-pad.active { background:var(--accent); color:#112116; }
    @media (max-width:720px) { main, main.ops-collapsed { grid-template-columns:1fr; grid-template-rows:auto minmax(340px, 56vh) auto; } #operator-sidebar, #operator-resize, #editor-panel, #player-resize, #right-panel { grid-column:auto; } .resize-handle { display:none; } #operator-sidebar { max-height:42vh; } section + section { border:0; border-top:1px solid var(--border); } #controls { min-height:220px; } }
  </style>
</head>
<body>
  <main>
    <section id="operator-sidebar" aria-label="AudioVM operator reference">
      <div class="section-head">
        <button id="operator-sidebar-toggle" type="button" aria-label="Collapse operator reference" aria-expanded="true">‹</button>
        <strong>Operators</strong>
        <span id="operator-sidebar-count"></span>
      </div>
      <input id="operator-search" type="search" placeholder="Search operators" aria-label="Search operators">
      <div id="operator-list" aria-live="polite"><p class="operator-empty">Loading operators…</p></div>
    </section>
    <div id="operator-resize" class="resize-handle" role="separator" aria-label="Resize operator reference" aria-orientation="vertical"></div>
    <section id="editor-panel">
      <div class="editor code">
        <div id="program" aria-label="Python AudioVM patch"></div>
      </div>
      <div class="editor-toolbar">
        <select id="presets" aria-label="Load preset" disabled><option value="">Presets…</option></select>
        <button id="load" disabled>Run ⌘⮐</button>
        <button id="play" disabled aria-label="Play">▶</button>
        <button id="web-midi" type="button" aria-label="Enable MIDI">🎹</button>
        <div id="audio-stats" hidden role="status" aria-label="Audio engine statistics">
          <span>CPU</span><span id="cpu-load">0%</span><span id="audio-format"></span>
        </div>
        <button id="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false" title="Switch to light theme">☀</button>
        <span id="status">Loading AudioVM…</span>
      </div>
    </section>
    <div id="player-resize" class="resize-handle" role="separator" aria-label="Resize code editor" aria-orientation="vertical"></div>
    <section id="right-panel" tabindex="0" aria-label="AudioVM controls and piano keyboard">
      <span id="control-count" hidden>0 controls</span>
      <div id="transport-bar" hidden aria-label="Transport">
        <button id="transport-toggle" type="button" aria-label="Play transport">▶</button>
        <label for="transport-bpm">BPM</label>
        <input id="transport-bpm" type="number" min="1" max="999" step="1" value="120" inputmode="numeric" lang="en-US">
        <label for="transport-position">Beat</label>
        <span class="transport-stepper">
          <input id="transport-position" type="text" value="0" inputmode="decimal" aria-label="Beat position, using a period as the decimal separator">
          <span class="transport-stepper-buttons">
            <button type="button" data-transport-position-step="1" aria-label="Increase beat position">▴</button>
            <button type="button" data-transport-position-step="-1" aria-label="Decrease beat position">▾</button>
          </span>
        </span>
        <label for="transport-loop">Loop</label>
        <input id="transport-loop" type="number" min="0" step="1" value="4" inputmode="numeric" lang="en-US" aria-label="Loop length in beats; zero disables looping">
      </div>
      <div id="audio-input-bar" hidden>
        <label for="audio-input-source">Input</label>
        <select id="audio-input-source" aria-label="Audio input source">
          <option value="none">None</option>
          <option value="audio-in">Audio in</option>
          <option value="noise">White noise</option>
          <option value="tone-100">100 Hz tone</option>
          <option value="tone-440">440 Hz tone</option>
          <option value="sweep">1 s sine sweep</option>
          <option value="impulse">Impulse</option>
          <option value="noise-burst">Noise burst</option>
          <option value="tones">Tones</option>
        </select>
        <label>Volume</label>
        <div id="audio-input-volume" class="knob" role="slider" tabindex="0" aria-label="Input volume"></div>
        <button id="audio-input-toggle" type="button" disabled>Start</button>
      </div>
      <div id="controls"><p class="empty">Load a patch to generate controls.</p></div>
      <pre id="warning" role="status"></pre>
      <pre id="error" role="alert"></pre>
      <div id="analysis-panel">
        <canvas id="analysis-canvas" aria-label="Audio oscilloscope and spectrum display"></canvas>
        <div id="analysis-toggles" aria-label="Analysis display options">
          <label id="show-input-toggle" hidden><input id="show-input" type="checkbox" checked>Input</label>
          <label><input id="show-output" type="checkbox" checked>Output</label>
          <label><input id="show-oscilloscope" type="checkbox" checked>Osc</label>
          <label><input id="show-spectrum" type="checkbox" checked>Spectrum</label>
          <select id="spectrum-frequency-scale" aria-label="Spectrum frequency scale">
            <option value="linear">Linear</option>
            <option value="log">Log</option>
            <option id="spectrum-scale-piano" value="piano" disabled>Piano</option>
          </select>
        </div>
      </div>
      <div class="keyboard-panel" hidden>
        <div id="piano" role="group" aria-label="Piano keyboard"></div>
      </div>
    </section>
  </main>
  <script type="module">
    import { EditorState, RangeSetBuilder } from 'https://cdn.jsdelivr.net/npm/@codemirror/state@6.5.2/+esm';
    import { EditorView, Decoration, ViewPlugin, keymap, lineNumbers } from 'https://cdn.jsdelivr.net/npm/@codemirror/view@6.36.4/+esm';
    import { indentUnit, indentOnInput } from 'https://cdn.jsdelivr.net/npm/@codemirror/language@6.11.0/+esm';
    import { defaultKeymap, history as editorHistory, historyKeymap, indentLess, indentMore } from 'https://cdn.jsdelivr.net/npm/@codemirror/commands@6.8.1/+esm';
    import { python as pythonLanguage } from 'https://cdn.jsdelivr.net/npm/@codemirror/lang-python@6.2.1/+esm';
    import { PythonPatchRunner, starterPatch } from './python-runner.js';
    import createAudioVM from './audiovm.js';

    const editorHost = document.querySelector('#program');
    const loadButton = document.querySelector('#load');
    const playButton = document.querySelector('#play');
    const webMidiButton = document.querySelector('#web-midi');
    const themeToggle = document.querySelector('#theme-toggle');
    const audioStats = document.querySelector('#audio-stats');
    const cpuLoad = document.querySelector('#cpu-load');
    const audioFormat = document.querySelector('#audio-format');
    const presetSelect = document.querySelector('#presets');
    const status = document.querySelector('#status');
    const controls = document.querySelector('#controls');
    const count = document.querySelector('#control-count');
    const warning = document.querySelector('#warning');
    const error = document.querySelector('#error');
    const rightPanel = document.querySelector('#right-panel');
    const transportBar = document.querySelector('#transport-bar');
    const transportToggle = document.querySelector('#transport-toggle');
    const transportBpm = document.querySelector('#transport-bpm');
    const transportPosition = document.querySelector('#transport-position');
    const transportLoop = document.querySelector('#transport-loop');
    const audioInputBar = document.querySelector('#audio-input-bar');
    const audioInputSource = document.querySelector('#audio-input-source');
    const audioInputVolume = document.querySelector('#audio-input-volume');
    const audioInputToggle = document.querySelector('#audio-input-toggle');
    const analysisCanvas = document.querySelector('#analysis-canvas');
    const showInput = document.querySelector('#show-input');
    const showInputToggle = document.querySelector('#show-input-toggle');
    const showOutput = document.querySelector('#show-output');
    const showOscilloscope = document.querySelector('#show-oscilloscope');
    const showSpectrum = document.querySelector('#show-spectrum');
    const spectrumFrequencyScale = document.querySelector('#spectrum-frequency-scale');
    const pianoSpectrumScale = document.querySelector('#spectrum-scale-piano');
    const keyboardPanel = document.querySelector('.keyboard-panel');
    const piano = document.querySelector('#piano');
    const main = document.querySelector('main');
    const editorPanel = document.querySelector('#editor-panel');
    const operatorSidebarToggle = document.querySelector('#operator-sidebar-toggle');
    const operatorResize = document.querySelector('#operator-resize');
    const playerResize = document.querySelector('#player-resize');
    const operatorSearch = document.querySelector('#operator-search');
    const operatorList = document.querySelector('#operator-list');
    const operatorCount = document.querySelector('#operator-sidebar-count');
    const setTheme = theme => {
      document.documentElement.dataset.theme = theme;
      const isLight = theme === 'light';
      themeToggle.textContent = isLight ? '☾' : '☀';
      themeToggle.setAttribute('aria-label', `Switch to ${isLight ? 'dark' : 'light'} theme`);
      themeToggle.title = themeToggle.getAttribute('aria-label');
      themeToggle.setAttribute('aria-pressed', String(isLight));
    };
    setTheme(document.documentElement.dataset.theme);
    themeToggle.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'));
    // This is one continuous Ableton-style piano row. Use physical positions so
    // the notes remain in place across QWERTY, AZERTY, QWERTZ, and Dvorak.
    // The punctuation keys immediately beyond P continue the row to the edge of
    // a standard keyboard.
    const keyboardSemitones = new Map([
      ['KeyA', 0], ['KeyW', 1], ['KeyS', 2], ['KeyE', 3], ['KeyD', 4], ['KeyF', 5],
      ['KeyT', 6], ['KeyG', 7], ['KeyY', 8], ['KeyH', 9], ['KeyU', 10], ['KeyJ', 11],
      ['KeyK', 12], ['KeyO', 13], ['KeyL', 14], ['KeyP', 15], ['Semicolon', 16],
      ['Quote', 17], ['BracketRight', 18], ['Backslash', 19],
    ]);
    const keyboardFallbackLabels = {
      KeyA:'A', KeyW:'W', KeyS:'S', KeyE:'E', KeyD:'D', KeyF:'F', KeyT:'T', KeyG:'G',
      KeyY:'Y', KeyH:'H', KeyU:'U', KeyJ:'J', KeyK:'K', KeyO:'O', KeyL:'L', KeyP:'P',
      Semicolon:';', Quote:"'", BracketRight:']', Backslash:'\\',
    };
    // Safari does not currently expose Keyboard Layout Map. Language is only a
    // fallback hint (not a keyboard-layout guarantee), but gives Swedish users
    // useful labels before their first key press; actual key events still win.
    const browserLanguages = navigator.languages?.length ? navigator.languages : [navigator.language];

    const wrappedLineIndent = ViewPlugin.fromClass(class {

      update(update) {
        if (update.docChanged) this.decorations = this.build(update.view);
      }
      build(view) {
        const builder = new RangeSetBuilder();
        for (let number = 1; number <= view.state.doc.lines; number++) {
          const line = view.state.doc.line(number);
          const leadingWhitespace = line.text.match(/^[\t ]*/)[0];
          const columns = [...leadingWhitespace].reduce((total, character) => total + (character === '\t' ? 2 : 1), 0);
          const indent = `${columns + 2}ch`;
          builder.add(line.from, line.from, Decoration.line({
            attributes: { style: `--wrap-indent:${indent};--wrap-outdent:-${indent}` },
          }));

    }, { decorations: plugin => plugin.decorations });

    const pythonBuiltins = new Set(['True', 'False', 'None', 'print', 'range', 'len', 'str', 'int', 'float', 'dict', 'list', 'set', 'tuple', 'type', 'isinstance']);
    const pythonSyntaxHighlighting = ViewPlugin.fromClass(class {
      constructor(view) { this.decorations = this.build(view); }
      update(update) {
        if (update.docChanged) this.decorations = this.build(update.view);
      }
      build(view) {
        const builder = new RangeSetBuilder();
        for (let number = 1; number <= view.state.doc.lines; number++) {
          const line = view.state.doc.line(number);
          let index = 0;
          while (index < line.text.length) {
            const character = line.text[index];
            if (character === '#') {
              builder.add(line.from + index, line.to, Decoration.mark({ class: 'cm-python-comment' }));
              break;
            }
            if (character === '"' || character === "'") {
              const quote = character;
              let end = index + 1;
              while (end < line.length) {
                if (line.text[end] === quote && line.text[end - 1] !== '\\') { end++; break; }
                end++;
              }
              builder.add(line.from + index, line.from + end, Decoration.mark({ class: 'cm-python-string' }));
              index = end;

            if (/\d/.test(character)) {
              const match = line.text.slice(index).match(/^\d+(?:\.\d*)?(?:[eE][+-]?\d+)?/)[0];

    const decodeUtf8 = bytes => {
      if (typeof TextDecoder === 'function') return new TextDecoder().decode(bytes);

      let text = '';
      for (let index = 0; index < bytes.length;) {
        const first = bytes[index++];
        if (first < 0x80) {
          text += String.fromCharCode(first);
          continue;
        }
        const continuation = () => index < bytes.length ? bytes[index++] & 0x3f : 0;
        let codePoint;
        if ((first & 0xe0) === 0xc0) {
          codePoint = (first & 0x1f) << 6 | continuation();
        } else if ((first & 0xf0) === 0xe0) {
          codePoint = (first & 0x0f) << 12 | continuation() << 6 | continuation();
        } else if ((first & 0xf8) === 0xf0) {
          codePoint = (first & 0x07) << 18 | continuation() << 12 | continuation() << 6 | continuation();
        } else {
          text += '\ufffd';
          continue;
        }
        text += String.fromCodePoint(codePoint);
      }
      return text;
    };

    const createKnob = ({ element, value, min, max, step, label, onInput }) => {
      const knob = element ?? document.createElement('div');
      knob.className = 'knob';
      knob.tabIndex = 0;
      knob.setAttribute('role', 'slider');
      knob.setAttribute('aria-label', label);
      knob.setAttribute('aria-valuemin', min);
      knob.setAttribute('aria-valuemax', max);
      let currentValue;
      const setValue = (nextValue, notify = true) => {
        const snapped = Math.round((Math.max(min, Math.min(max, nextValue)) - min) / step) * step + min;
        currentValue = Math.max(min, Math.min(max, snapped));
        const progress = (currentValue - min) / (max - min);

    };
    document.querySelectorAll('[data-transport-position-step]').forEach(button => {
      button.addEventListener('click', () => stepTransportPosition(Number(button.dataset.transportPositionStep)));
    });
    transportPosition.addEventListener('keydown', event => {
      if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
        event.preventDefault();
        stepTransportPosition(event.key === 'ArrowUp' ? 1 : -1);
      }
    });
    transportLoop.addEventListener('change', () => {
      const loopBeats = Number(transportLoop.value);
      if (Number.isFinite(loopBeats) && loopBeats >= 0) postTransport({ loopBeats }); else renderTransport();
    });
    const keyboardRange = [...keyboardSemitones.values()];
    const keyboardMaxSemitone = Math.max(...keyboardRange);
    const midiNoteForCode = code => kitPads.length
      ? 60 + keyboardSemitones.get(code)
      : 12 * (baseOctave + 1) + keyboardSemitones.get(code);
    const keyboardLabelForCode = code => {
      const label = keyboardLabels.get(code) || keyboardDefaultLabels[code] || code;
      return label.length === 1 ? label.toLocaleUpperCase() : label;
    };
    const rememberKeyboardLabel = event => {
      // Browsers without Keyboard Layout Map still reveal a key's actual symbol
      // when it is played, so refine the fallback label opportunistically.
      if (!keyboardSemitones.has(event.code) || event.key.length !== 1 || keyboardLabels.get(event.code) === event.key) return;
      keyboardLabels.set(event.code, event.key);
      renderPiano();
    };
    const updateKeyboardLayout = async () => {
      // Keyboard Layout Map is optional and deliberately only supplies labels; it
      // must not change which physical key makes which note.
      if (!navigator.keyboard?.getLayoutMap) return;
      try {
        const layout = await navigator.keyboard.getLayoutMap();
        keyboardLabels = new Map([...keyboardSemitones.keys()].map(code => [code, layout.get(code) || keyboardDefaultLabels[code]]));
        renderPiano();
      } catch {
        // The fallback labels are a useful, readable US-layout approximation.
      }
    };
    const updatePianoKey = midi => pianoKeys.get(midi)?.classList.toggle('active', [...activeMidiSources.values()].includes(midi));
    function updatePianoFrequencyStops() {
      const pianoRect = piano.getBoundingClientRect();
      if (!pianoRect.width) return;
      const analysisRect = analysisCanvas.getBoundingClientRect();
      pianoSpectrumStart = (analysisRect.left - pianoRect.left) / pianoRect.width;
      pianoSpectrumSpan = analysisRect.width / pianoRect.width;
      pianoFrequencyStops = [...pianoKeys.entries()].map(([midi, key]) => {
        const keyRect = key.getBoundingClientRect();
        return {
          midi,
          position: (keyRect.left + keyRect.width / 2 - pianoRect.left) / pianoRect.width,
          frequency: 440 * Math.pow(2, (midi - 69) / 12),
        };
      }).sort((a, b) => a.position - b.position);
    }
    const renderPiano = () => {
      if (kitPads.length) {
        piano.classList.add('kit');
        piano.style.gridTemplateColumns = `repeat(${kitPads.length}, minmax(0, 1fr))`;
        piano.replaceChildren(); pianoKeys = new Map();
        kitPads.forEach((pad, index) => {
          const midi = 60 + index;
          const key = document.createElement('button');
          key.className = 'piano-key kit-pad'; key.dataset.midi = midi;
          const code = [...keyboardSemitones.keys()][index];
          const label = code ? keyboardLabelForCode(code) : '';
          key.setAttribute('aria-label', `${pad}${label ? `, ${label} key` : ''}`);
          key.innerHTML = `${label ? `<span class="key-label">${label}</span>` : ''}${pad}`;
          piano.append(key); pianoKeys.set(midi, key);
        });
        pianoFrequencyStops = [];
        return;
      }
      piano.classList.remove('kit');
      const whiteCount = Math.max(17, Math.ceil(piano.clientWidth / 24));
      const natural = [0, 2, 4, 5, 7, 9, 11];
      const firstC = 12 * baseOctave;
      const labels = new Map();
      for (const [code, semitone] of keyboardSemitones) {
        const midi = 12 * (baseOctave + 1) + semitone;
        const existing = labels.get(midi) || [];
        existing.push(keyboardLabelForCode(code));
        labels.set(midi, existing);
      }
      piano.style.gridTemplateColumns = `repeat(${whiteCount}, 24px)`;
      piano.replaceChildren(); pianoKeys = new Map();
      for (let index = 0; index < whiteCount; index++) {
        const midi = firstC + 12 * Math.floor(index / 7) + natural[index % 7];
        const octave = Math.floor(midi / 12) - 1;
        const isC = midi % 12 === 0, keys = labels.get(midi);
        const white = document.createElement('button');
        white.className = 'piano-key white'; white.style.gridColumn = index + 1; white.dataset.midi = midi;
        white.setAttribute('aria-label', `${isC ? 'C' + octave : 'MIDI ' + midi}${keys ? ', ' + keys.join(' / ') + ' key' : ''}`);
        white.innerHTML = `${keys ? `<span class="key-label">${keys.join(' ')}</span>` : ''}${isC ? `<span class="octave-label">C${octave}</span>` : ''}`;
        piano.append(white); pianoKeys.set(midi, white);
        const next = firstC + 12 * Math.floor((index + 1) / 7) + natural[(index + 1) % 7];
        if (next - midi === 2) {
          const black = document.createElement('button'), blackMidi = midi + 1, blackKeys = labels.get(blackMidi);
          black.className = 'piano-key black';
          black.style.left = `${(index + 1) * 24 - 7}px`;
          black.dataset.midi = blackMidi;
          black.setAttribute('aria-label', `MIDI ${blackMidi}${blackKeys ? ', ' + blackKeys.join(' / ') + ' key' : ''}`);
          black.textContent = blackKeys?.join(' ') || ''; piano.append(black); pianoKeys.set(blackMidi, black);
        }
      }
      updatePianoFrequencyStops();
    };
    const transposeOctave = amount => {
      const maxBaseOctave = Math.floor((127 - keyboardMaxSemitone) / 12) - 1;
      const next = Math.max(0, Math.min(maxBaseOctave, baseOctave + amount));
      if (next === baseOctave) return;
      releaseAllNotes();
      baseOctave = next;
      renderPiano();
    };
    renderPiano();
    updateKeyboardLayout();
    new ResizeObserver(renderPiano).observe(piano);
    const sendNoteOn = (source, midi) => {
      if (activeMidiSources.has(source)) return;
      if (!processor) return;
      activeMidiSources.set(source, midi);
      audioNode.port.postMessage({ type: 'midi', status: 0x90, data1: midi, data2: 100 });
      updatePianoKey(midi);
      start().catch(cause => showError(`Could not start audio: ${cause.message}`));
    };
    const sendNoteOff = source => {
      const midi = activeMidiSources.get(source);
      if (midi === undefined) return;
      activeMidiSources.delete(source);
      if (![...activeMidiSources.values()].includes(midi)) {
        audioNode.port.postMessage({ type: 'midi', status: 0x80, data1: midi, data2: 0 });
      }
      updatePianoKey(midi);
    };
    const releaseAllNotes = () => {
      for (const source of activeMidiSources.keys()) sendNoteOff(source);
    };
    const updateInputVolume = () => {
      if (inputGain && audioContext) inputGain.gain.setTargetAtTime(inputVolume, audioContext.currentTime, 0.01);
    };
    const analysisContext = analysisCanvas.getContext('2d');
    const analysisData = {
      inputTime: new Float32Array(0), outputTime: new Float32Array(0),
      inputSpectrum: new Float32Array(0), outputSpectrum: new Float32Array(0),
    };
    const resizeAnalysisCanvas = () => {
      const rect = analysisCanvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      analysisCanvas.width = Math.max(1, Math.round(rect.width * scale));
      analysisCanvas.height = Math.max(1, Math.round(rect.height * scale));
      analysisContext.setTransform(scale, 0, 0, scale, 0, 0);
      updatePianoFrequencyStops();
    };
    const readAnalysisData = (analyser, timeKey, spectrumKey) => {
      if (!analyser) return;
      if (analysisData[timeKey].length !== analyser.fftSize) analysisData[timeKey] = new Float32Array(analyser.fftSize);
      if (analysisData[spectrumKey].length !== analyser.frequencyBinCount) analysisData[spectrumKey] = new Float32Array(analyser.frequencyBinCount);
      analyser.getFloatTimeDomainData(analysisData[timeKey]);
      analyser.getFloatFrequencyData(analysisData[spectrumKey]);
    };
    const findRisingZeroCrossing = data => {
      let crossing = -1, distance = Infinity;
      const middle = data.length / 2;
      for (let index = 0; index < data.length - 1; index++) {
        if (data[index] <= 0 && data[index + 1] > 0 && Math.abs(index - middle) < distance) {
          crossing = index;
          distance = Math.abs(index - middle);
        }
      }
      return crossing;
    };
    const spectrumBinAt = (position, binCount) => {
      const nyquist = audioContext ? audioContext.sampleRate / 2 : 24000;
      if (spectrumFrequencyScale.value === 'linear') return Math.floor(position * (binCount - 1));
      let frequency;
      if (spectrumFrequencyScale.value === 'piano' && pianoFrequencyStops.length > 1) {
        const target = pianoSpectrumStart + position * pianoSpectrumSpan;
        let right = pianoFrequencyStops.findIndex(stop => stop.position >= target);
        if (right < 0) right = pianoFrequencyStops.length - 1;
        const left = Math.max(0, right - 1);
        const a = pianoFrequencyStops[left], b = pianoFrequencyStops[right];
        const mix = a === b ? 0 : (target - a.position) / (b.position - a.position);
        frequency = a.frequency * Math.pow(b.frequency / a.frequency, Math.max(0, Math.min(1, mix)));
      } else {
        frequency = 20 * Math.pow(nyquist / 20, position);
      }
      return Math.max(0, Math.min(binCount - 1, Math.floor(frequency / nyquist * binCount)));
    };
    const drawSpectrum = (data, color, width, height) => {
      const floor = -96;
      analysisContext.beginPath();
      analysisContext.moveTo(0, height);
      for (let x = 0; x <= width; x++) {
        const index = spectrumBinAt(x / width, data.length);
        const amount = Math.max(0, Math.min(1, (data[index] - floor) / -floor));
        analysisContext.lineTo(x, height - amount * height);
      }
      analysisContext.lineTo(width, height);
      analysisContext.closePath();
      analysisContext.fillStyle = color;
      analysisContext.fill();
    };
    const drawWaveform = (data, color, anchor, width, height) => {
      const crossing = findRisingZeroCrossing(anchor) >= 0 ? findRisingZeroCrossing(anchor) : Math.floor(data.length / 2);
      const start = crossing - Math.floor(data.length / 2);
      analysisContext.beginPath();
      for (let x = 0; x <= width; x++) {
        const index = (start + Math.floor(x / width * data.length) + data.length) % data.length;
        const y = height / 2 - Math.max(-1, Math.min(1, data[index])) * height * 0.45;
        x ? analysisContext.lineTo(x, y) : analysisContext.moveTo(x, y);
      }
      analysisContext.strokeStyle = color;
      analysisContext.lineWidth = 1.5;
      analysisContext.stroke();
    };
    const drawAnalysis = () => {
      requestAnimationFrame(drawAnalysis);
      const { width, height } = analysisCanvas.getBoundingClientRect();
      if (!width || !height) return;
      readAnalysisData(inputAnalyser, 'inputTime', 'inputSpectrum');
      readAnalysisData(outputAnalyser, 'outputTime', 'outputSpectrum');
      analysisContext.clearRect(0, 0, width, height);
      const theme = getComputedStyle(document.documentElement);
      analysisContext.fillStyle = theme.getPropertyValue('--analysis');
      analysisContext.fillRect(0, 0, width, height);
      analysisContext.strokeStyle = theme.getPropertyValue('--canvas-grid');
      analysisContext.lineWidth = 1;
      analysisContext.beginPath(); analysisContext.moveTo(0, height / 2); analysisContext.lineTo(width, height / 2); analysisContext.stroke();
      if (showSpectrum.checked) {
        if (showInput.checked && analysisData.inputSpectrum.length) drawSpectrum(analysisData.inputSpectrum, 'rgba(78, 159, 255, .34)', width, height);
        if (showOutput.checked && analysisData.outputSpectrum.length) drawSpectrum(analysisData.outputSpectrum, 'rgba(255, 102, 108, .34)', width, height);
      }
      if (showOscilloscope.checked) {
        const anchor = showOutput.checked && analysisData.outputTime.length ? analysisData.outputTime : analysisData.inputTime;
        if (showInput.checked && analysisData.inputTime.length) drawWaveform(analysisData.inputTime, '#4e9fff', anchor, width, height);
        if (showOutput.checked && analysisData.outputTime.length) drawWaveform(analysisData.outputTime, '#ff666c', anchor, width, height);
      }
    };
    new ResizeObserver(resizeAnalysisCanvas).observe(analysisCanvas);
    resizeAnalysisCanvas();
    requestAnimationFrame(drawAnalysis);
    showSpectrum.addEventListener('change', () => {
      spectrumFrequencyScale.hidden = !showSpectrum.checked;
    });
    const makeInputBuffer = () => {
      const type = audioInputSource.value;
      const toneFrequencies = [55, 110, 220, 440, 880, 1760, 3520, 7040];
      const frames = audioContext.sampleRate * (type === 'tones' ? toneFrequencies.length / 2 : 1);
      const buffer = audioContext.createBuffer(1, frames, audioContext.sampleRate);
      const samples = buffer.getChannelData(0);
      const sampleRate = audioContext.sampleRate;
      let phase = 0;
      for (let frame = 0; frame < frames; frame++) {
        if (type === 'impulse') samples[frame] = frame === 0 ? 1 : 0;
        else if (type === 'noise-burst') samples[frame] = frame < sampleRate * 0.1 ? Math.random() * 2 - 1 : 0;
        else if (type === 'noise') samples[frame] = Math.random() * 2 - 1;
        else if (type === 'tones') {
          const toneFrames = frames / toneFrequencies.length;
          const tone = Math.min(toneFrequencies.length - 1, Math.floor(frame / toneFrames));
          const toneTime = (frame - tone * toneFrames) / sampleRate;
          samples[frame] = Math.exp(-6 * toneTime) * Math.sin(2 * Math.PI * toneFrequencies[tone] * toneTime);
        }
        else {
          const frequency = type === 'tone-100' ? 100 : type === 'tone-440' ? 440 : 20 * Math.pow(1000, frame / frames);
          samples[frame] = Math.sin(phase);
          phase += 2 * Math.PI * frequency / sampleRate;
        }
      }
      return buffer;
    };
    const stopInputSource = () => {
      ++inputRequest;
      if (inputSource) {
        inputSource.onended = null;
        if (!inputStream) inputSource.stop();
        inputSource.disconnect();
      }
      if (inputStream) inputStream.getTracks().forEach(track => track.stop());
      inputStream = undefined;
      inputSource = undefined;
      audioInputToggle.textContent = 'Start';
    };
    const startInputSource = async () => {
      if (!audioNode || !audioContext) return;
      stopInputSource();
      const type = audioInputSource.value;
      if (type === 'none') return;
      const request = inputRequest;
      await start();
      if (request !== inputRequest) return;
      let stream;
      if (type === 'audio-in') {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (request !== inputRequest) {
          stream.getTracks().forEach(track => track.stop());
          return;
        }
      }
      if (!inputGain) {
        inputGain = audioContext.createGain();
        inputGain.connect(inputAnalyser);
      }
      updateInputVolume();
      inputStream = stream;
      inputSource = stream ? audioContext.createMediaStreamSource(stream) : audioContext.createBufferSource();
      if (!stream) {
        inputSource.buffer = makeInputBuffer();
        inputSource.loop = true;
      }
      inputSource.connect(inputGain);
      if (!stream) inputSource.start();
      audioInputToggle.textContent = 'Stop';
    };
    audioInputToggle.addEventListener('click', () => {
      if (inputSource) stopInputSource();
      else startInputSource().catch(cause => showError(`Could not start input: ${cause.message}`));
    });
    createKnob({
      element: audioInputVolume,
      value: inputVolume,
      min: 0,
      max: 1,
      step: 0.01,
      label: 'Input volume',
      onInput: value => { inputVolume = value; updateInputVolume(); },
    });
    audioInputSource.addEventListener('change', () => {
      if (inputSource) startInputSource().catch(cause => showError(`Could not change input: ${cause.message}`));
      else stopInputSource();
    });
    updateInputVolume();
    rightPanel.addEventListener('pointerdown', event => {
      if (!event.target.closest('.piano-key')) rightPanel.focus();
    });
    piano.addEventListener('pointerdown', event => {
      const pianoKey = event.target.closest('.piano-key');
      if (!pianoKey) return;
      event.preventDefault(); rightPanel.focus(); pianoKey.setPointerCapture(event.pointerId);
      const midi = Number(pianoKey.dataset.midi);
      pointerNotes.set(event.pointerId, midi);
      sendNoteOn(`pointer${event.pointerId}`, midi);
    });
    piano.addEventListener('pointermove', event => {
      if (!pointerNotes.has(event.pointerId)) return;
      const nextMidi = Number(document.elementFromPoint(event.clientX, event.clientY)?.closest('.piano-key')?.dataset.midi);
      const previousMidi = pointerNotes.get(event.pointerId);
      if (nextMidi === previousMidi) return;
      sendNoteOff(`pointer${event.pointerId}`);
      pointerNotes.set(event.pointerId, Number.isFinite(nextMidi) ? nextMidi : null);
      if (Number.isFinite(nextMidi)) sendNoteOn(`pointer${event.pointerId}`, nextMidi);
    });
    for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      piano.addEventListener(eventName, event => {
        if (!pointerNotes.has(event.pointerId)) return;
        pointerNotes.delete(event.pointerId);
        sendNoteOff(`pointer${event.pointerId}`);
      }
      );
    }
    rightPanel.addEventListener('keydown', event => {
      if (event.code === 'Space' && !transportBar.hidden &&
          !event.target.matches('input, select, button')) {
        event.preventDefault();
        toggleTransport();
        return;
      }
      if (keyboardPanel.hidden) return;
      rememberKeyboardLabel(event);
      if (event.code === 'KeyZ' || event.code === 'KeyX') {
        if (kitPads.length) return;
        event.preventDefault();
        if (!event.repeat) transposeOctave(event.code === 'KeyZ' ? -1 : 1);
        return;
      }
      if (event.ctrlKey || event.metaKey || event.altKey || !keyboardSemitones.has(event.code) || event.repeat ||
          (kitPads.length && keyboardSemitones.get(event.code) >= kitPads.length)) return;
      event.preventDefault();
      sendNoteOn(`keyboard:${event.code}`, midiNoteForCode(event.code));
    });
    rightPanel.addEventListener('keyup', event => {
      if (keyboardPanel.hidden) return;
      if (!keyboardSemitones.has(event.code) ||
          (kitPads.length && keyboardSemitones.get(event.code) >= kitPads.length)) return;
      event.preventDefault();
      sendNoteOff(`keyboard:${event.code}`);
    });
    window.addEventListener('blur', releaseAllNotes);
    const loadPatch = async () => {
      clearError();
      showWarnings([]);
      if (!resourcesReady) {
        status.textContent = 'Waiting for AudioVM resources…';
        try { await runtimeReady; }
        catch { return; }
      }
      let compiled;
      try { compiled = await python.compile(editor.value, message => { status.textContent = message; }); }
      catch (cause) { showError(`Python patch error: ${cause.message}`); status.textContent = 'Python error'; return; }
      showWarnings(compiled.warnings);
      const parsed = JSON.parse(compiled.graph);
      try {
        status.textContent = 'Preparing audio worklet…';
        stop();
        releaseAllNotes();
        await ensureAudioWorklet();
        status.textContent = 'Activating audio worklet…';
        connectOutput();
        await audioContext.resume();
        status.textContent = 'Sending patch to audio worklet…';
        processor = false;
        const wasmResponse = await fetch('./audiovm.wasm');
        if (!wasmResponse.ok) throw new Error(`Could not load audiovm.wasm (${wasmResponse.status})`);
        const wasmBinary = await wasmResponse.arrayBuffer();
        await postToWorklet({ type: 'load', json: JSON.stringify(parsed), wasmBinary }, [wasmBinary]);
        stop();
        processor = true;
        Object.assign(transport, { bpm: 120, play: false, beatPos: 0, loopBeats: 4 });
        postTransport(transport);
        renderControls(parsed);
        updatePianoVisibility(parsed);
        updateTransportVisibility(parsed);
        updateAudioInputVisibility(parsed);
        playButton.disabled = false;
        status.textContent = 'Patch loaded';
      } catch (cause) {
        showError(`AudioVM could not load this patch: ${cause.message}`);
        status.textContent = 'Load failed';
      }
    };

    const savePatch = async () => {
      const filename = presetSelect.value || 'patch.py';
      try {
        if ('showSaveFilePicker' in window) {
          const fileHandle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: 'Python patch', accept: { 'text/x-python': ['.py'] } }],
          });
          const writable = await fileHandle.createWritable();
          await writable.write(editor.value);
          await writable.close();
        } else {
          const blob = new Blob([editor.value], { type: 'text/x-python' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = filename;
          link.click();
          URL.revokeObjectURL(url);
        }
        status.textContent = 'Patch saved';
      } catch (cause) {
        if (cause.name !== 'AbortError') showError(`Could not save patch: ${cause.message}`);
      }
    };

    const loadPreset = async (preset, updateURL = true) => {
      try {
        const presetUrl = new URL(preset, new URL('./presets/', import.meta.url));
        const response = await fetch(presetUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        editor.value = await response.text();
        presetSelect.value = preset;
        if (updateURL) {
          const url = new URL(window.location.href);
          url.searchParams.set('preset', preset);
          history.replaceState(null, '', url);
        }
        await loadPatch();
      } catch (cause) {
        showError(`Could not load preset: ${cause.message}`);
      }
    };

    loadButton.addEventListener('click', loadPatch);
    playButton.addEventListener('click', () => {
      if (playButton.classList.contains('playing')) stop();
      else start().catch(cause => showError(`Could not start audio: ${cause.message}`));
    });
    webMidiButton.addEventListener('click', async () => {
      if (!navigator.requestMIDIAccess) {
        showError('Web MIDI is not supported by this browser.');
        return;
      }
      try {
        webMidiButton.disabled = true;
        webMidiButton.textContent = '🎹';
        webMidiButton.setAttribute('aria-label', 'Enabling MIDI');
        if (!webMidiAccess) {
          webMidiAccess = await navigator.requestMIDIAccess();
          webMidiAccess.onstatechange = attachWebMidiInputs;
        }
        attachWebMidiInputs();
        status.textContent = 'Web MIDI enabled';
      } catch (cause) {
        webMidiButton.disabled = false;
        webMidiButton.textContent = '🎹';
        webMidiButton.setAttribute('aria-label', 'Enable MIDI');
        showError(`Could not enable Web MIDI: ${cause.message || cause}`);
      }
    });
    presetSelect.addEventListener('change', async () => {
      if (!presetSelect.value) return;
      await loadPreset(presetSelect.value);
    });
    const runtimeReady = python.prepare(message => { status.textContent = message; })
    .then(() => {
      resourcesReady = true;
      updateActionAvailability();
      status.textContent = 'Ready to load a patch';
    }).catch(cause => {
      showError(`AudioVM runtime failed to load: ${cause.message}`);
      status.textContent = 'Runtime unavailable';
    });
    const presetsReady = loadPresets();
    Promise.all([runtimeReady, presetsReady]).then(async ([, presets]) => {
      if (!requestedPreset || !resourcesReady) return;
      if (!presets.includes(requestedPreset)) {
        showError(`Could not load preset: unknown preset '${requestedPreset}'`);
        status.textContent = 'Load failed';
        return;
      }
      await loadPreset(requestedPreset, false);
    });
  </script>
</body>
</html>
