<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AudioVM Player</title>
  <style>
    :root { color-scheme: dark; --bg:#111214; --panel:#191b1f; --border:#30343a; --text:#e8eaf0; --muted:#9299a5; --accent:#92e5b1; --danger:#ff8f8f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.4 ui-sans-serif, system-ui, sans-serif; }
    #status { min-width:0; margin-left:auto; overflow:hidden; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    button { border:1px solid var(--border); border-radius:5px; background:#282c32; color:var(--text); padding:7px 11px; font:inherit; cursor:pointer; }
    button:hover:not(:disabled) { border-color:var(--accent); }
    button:disabled { cursor:wait; opacity:.55; }
    select { max-width:180px; border:1px solid var(--border); border-radius:5px; background:#282c32; color:var(--text); padding:7px 28px 7px 9px; font:inherit; }
    select:disabled { cursor:wait; opacity:.55; }
    #play.playing { background:var(--accent); color:#102116; border-color:var(--accent); }
    main { display:grid; grid-template-columns:minmax(320px, 1.2fr) minmax(280px, .8fr); min-height:100vh; }
    section { min-width:0; display:flex; flex-direction:column; }
    section + section { border-left:1px solid var(--border); }
    .section-head { display:flex; align-items:center; min-height:44px; padding:8px 14px; border-bottom:1px solid var(--border); background:var(--panel); }
    .section-head strong { font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .section-head span { margin-left:auto; color:var(--muted); font-size:12px; }
    .editor { flex:1; min-height:0; display:flex; background:#14161a; }
    .code { font:13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size:2; }
    #gutter { flex:0 0 46px; overflow:hidden; padding:16px 9px 40px 0; border-right:1px solid var(--border); color:#69717d; text-align:right; user-select:none; white-space:pre; }
    .code-stack { position:relative; flex:1; min-width:0; }
    #highlight, #program { position:absolute; inset:0; margin:0; padding:16px 22px 40px 14px; border:0; font:inherit; line-height:inherit; letter-spacing:inherit; tab-size:inherit; white-space:pre; }
    #highlight { overflow:hidden; pointer-events:none; color:#d7e5dc; }
    #program { width:100%; resize:none; outline:0; overflow:auto; background:transparent; color:transparent; caret-color:#e8eaf0; -webkit-text-fill-color:transparent; }
    #program::selection { background:rgba(146,229,177,.32); }
    .editor-toolbar { flex:none; min-height:58px; padding:10px 14px; display:flex; align-items:center; gap:10px; border-top:1px solid var(--border); background:var(--panel); }
    .editor-toolbar button, .editor-toolbar select { flex:none; white-space:nowrap; }
    #audio-stats { display:flex; align-items:center; gap:5px; min-height:30px; padding:0 7px; border:1px solid var(--border); border-radius:4px; background:#1b1e23; color:var(--muted); font:10px ui-monospace, monospace; white-space:nowrap; }
    #audio-stats[hidden] { display:none; }
    #cpu-load { min-width:30px; color:var(--accent); text-align:right; }
    #audio-format { padding-left:5px; border-left:1px solid var(--border); }
    .token-keyword { color:#c99bff; } .token-string { color:#9ee6b4; } .token-number { color:#f2c17d; }
    .token-comment { color:#737b87; font-style:italic; } .token-builtin { color:#82caff; } .token-function { color:#ffb7cf; }
    #controls { flex:1; padding:12px 14px 28px; overflow:auto; }
    .empty { color:var(--muted); margin:8px 0; }
    .control { padding:13px 0 15px; border-bottom:1px solid var(--border); }
    .control-row { display:flex; gap:12px; align-items:baseline; margin-bottom:8px; }
    .control label { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    output { margin-left:auto; color:var(--accent); font:12px ui-monospace, monospace; }
    input[type=range] { width:100%; accent-color:var(--accent); }
    #error { display:none; margin:0; padding:9px 14px; background:#331d20; color:var(--danger); border-top:1px solid #67353a; font:12px/1.4 ui-monospace, monospace; white-space:pre-wrap; }
    #right-panel:focus { outline:2px solid var(--accent); outline-offset:-2px; }
    .keyboard-panel { flex:none; padding:6px 14px 8px; border-top:1px solid var(--border); background:var(--panel); }
    #piano { position:relative; height:66px; display:grid; border:1px solid #090a0c; border-radius:4px; overflow:visible; background:#e8e9e8; }
    .piano-key { touch-action:none; user-select:none; }
    .piano-key.white { position:relative; grid-row:1; min-width:0; border:0; border-right:1px solid #8e9394; border-radius:0; background:#f5f5f1; color:transparent; padding:0; font:10px ui-monospace, monospace; }
    .key-label { position:absolute; right:0; bottom:4px; left:0; text-align:center; }
    .octave-label { position:absolute; top:4px; right:0; left:0; font-size:9px; font-weight:700; text-align:center; }
    .piano-key.white:last-of-type { border-right:0; }
    .piano-key.black { position:absolute; z-index:2; top:0; left:calc(var(--after) * (100% / var(--white-count)) - 7px); width:14px; height:39px; border:1px solid #050607; border-radius:0 0 4px 4px; background:#171a1e; color:transparent; padding:0 1px 4px; display:flex; align-items:end; justify-content:center; font:9px ui-monospace, monospace; }
    #right-panel:focus-within .piano-key.white { color:#25282b; }
    #right-panel:focus-within .piano-key.black { color:#dfe4e9; }
    .piano-key:hover { border-color:var(--accent); }
    .piano-key.active { background:var(--accent); color:#112116; border-color:var(--accent); }
    .piano-key.black.active { background:#76c995; color:#102116; }
    @media (max-width:720px) { main { grid-template-columns:1fr; grid-template-rows:minmax(340px, 56vh) auto; } section + section { border:0; border-top:1px solid var(--border); } #controls { min-height:220px; } }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="section-head"><strong>patch.py</strong><span>Ctrl / ⌘ + Enter to load</span></div>
      <div class="editor code">
        <div id="gutter" aria-hidden="true">1</div>
        <div class="code-stack">
          <pre id="highlight" aria-hidden="true"></pre>
          <textarea id="program" spellcheck="false" aria-label="Python AudioVM patch"></textarea>
        </div>
      </div>
      <div class="editor-toolbar">
        <select id="presets" aria-label="Load preset" disabled><option value="">Presets…</option></select>
        <button id="load" disabled>Load patch</button>
        <button id="save" type="button">Save</button>
        <button id="play" disabled>Play</button>
        <div id="audio-stats" hidden role="status" aria-label="Audio engine statistics">
          <span>CPU</span><span id="cpu-load">0%</span><span id="audio-format"></span>
        </div>
        <span id="status">Loading AudioVM…</span>
      </div>
    </section>
    <section id="right-panel" tabindex="0" aria-label="AudioVM controls and piano keyboard">
      <div class="section-head"><strong>Controls</strong><span id="control-count">0 controls</span></div>
      <div id="controls"><p class="empty">Load a patch to generate controls.</p></div>
      <pre id="error" role="alert"></pre>
      <div class="keyboard-panel">
        <div id="piano" role="group" aria-label="Piano keyboard"></div>
      </div>
    </section>
  </main>
  <script type="module">
    import { PythonPatchRunner, starterPatch } from './python-runner.js';

    const editor = document.querySelector('#program');
    const loadButton = document.querySelector('#load');
    const saveButton = document.querySelector('#save');
    const playButton = document.querySelector('#play');
    const audioStats = document.querySelector('#audio-stats');
    const cpuLoad = document.querySelector('#cpu-load');
    const audioFormat = document.querySelector('#audio-format');
    const presetSelect = document.querySelector('#presets');
    const status = document.querySelector('#status');
    const controls = document.querySelector('#controls');
    const count = document.querySelector('#control-count');
    const error = document.querySelector('#error');
    const highlight = document.querySelector('#highlight');
    const gutter = document.querySelector('#gutter');
    const rightPanel = document.querySelector('#right-panel');
    const piano = document.querySelector('#piano');
    const keyboardSemitones = new Map(Object.entries({ a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12, o:13, l:14, p:15 }));
    let pianoKeys = new Map();
    editor.value = starterPatch;

    const keywords = new Set(['and', 'as', 'assert', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'if', 'import', 'in', 'is', 'lambda', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield']);
    const builtins = new Set(['True', 'False', 'None', 'print', 'range', 'len', 'str', 'int', 'float', 'dict', 'list', 'set', 'tuple', 'type', 'isinstance']);
    const escapeHTML = text => text.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
    const highlightPythonLine = line => {
      let html = '', index = 0, functionName = false;
      while (index < line.length) {
        const char = line[index];
        if (char === '#') { html += `<span class="token-comment">${escapeHTML(line.slice(index))}</span>`; break; }
        if (char === '"' || char === "'") {
          const quote = char; let end = index + 1;
          while (end < line.length) { if (line[end] === quote && line[end - 1] !== '\\') { end++; break; } end++; }
          html += `<span class="token-string">${escapeHTML(line.slice(index, end))}</span>`; index = end; continue;
        }
        if (/\d/.test(char)) {
          const match = line.slice(index).match(/^\d+(?:\.\d*)?(?:[eE][+-]?\d+)?/)[0];
          html += `<span class="token-number">${match}</span>`; index += match.length; continue;
        }
        if (/[A-Za-z_]/.test(char)) {
          const word = line.slice(index).match(/^[A-Za-z_]\w*/)[0];
          const className = keywords.has(word) ? 'token-keyword' : functionName ? 'token-function' : builtins.has(word) ? 'token-builtin' : '';
          html += className ? `<span class="${className}">${word}</span>` : word;
          functionName = word === 'def' || word === 'class'; index += word.length; continue;
        }
        html += escapeHTML(char); index++;
      }
      return html;
    };
    const updateEditorChrome = () => {
      const lines = editor.value.split('\n');
      highlight.innerHTML = lines.map(highlightPythonLine).join('\n') + '\n';
      gutter.textContent = lines.map((_, index) => index + 1).join('\n');
    };
    editor.addEventListener('input', updateEditorChrome);
    editor.addEventListener('scroll', () => {
      highlight.scrollTop = editor.scrollTop; highlight.scrollLeft = editor.scrollLeft; gutter.scrollTop = editor.scrollTop;
    });
    updateEditorChrome();

    const python = new PythonPatchRunner();
    let processor = false;
    let audioContext;
    let audioNode;
    let audioConnected = false;
    let workletModuleReady;
    let nextWorkletRequestId = 1;
    const workletRequests = new Map();
    let resourcesReady = false;
    let presetFilesReady = false;
    const outputChannels = 2;
    const activeMidiSources = new Map();
    const pointerNotes = new Map();
    let baseOctave = 4;

    const showError = message => { error.textContent = message; error.style.display = 'block'; };
    const clearError = () => { error.textContent = ''; error.style.display = 'none'; };
    const updateActionAvailability = () => {
      loadButton.disabled = !resourcesReady;
      presetSelect.disabled = !resourcesReady || !presetFilesReady;
    };
    const loadPresets = async () => {
      try {
        const response = await fetch('./presets.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const presets = await response.json();
        for (const preset of presets) {
          const option = document.createElement('option');
          option.value = preset;
          option.textContent = preset.replace(/\.py$/, '');
          presetSelect.append(option);
        }
        presetFilesReady = presets.length > 0;
        updateActionAvailability();
      } catch (cause) {
        console.warn('Could not load presets:', cause);
      }
    };
    const sliderOptions = () => [0, 1, 0.001];
    const renderControls = graph => {
      const controlNodes = graph.program.filter(node => node.type === 'control');
      controls.replaceChildren();
      count.textContent = `${controlNodes.length} control${controlNodes.length === 1 ? '' : 's'}`;
      if (!controlNodes.length) {
        controls.innerHTML = '<p class="empty">This patch has no Control operators.</p>';
        return;
      }
      controlNodes.forEach((node, index) => {
        const value = Number(node.input) || 0;
        const [min, max, step] = sliderOptions(node.id, value);
        const wrapper = document.createElement('div');
        wrapper.className = 'control';
        const row = document.createElement('div');
        row.className = 'control-row';
        const label = document.createElement('label');
        label.htmlFor = `control-${index}`;
        label.textContent = node.id;
        const output = document.createElement('output');
        const slider = document.createElement('input');
        slider.type = 'range'; slider.id = label.htmlFor;
        slider.min = min; slider.max = max; slider.step = step; slider.value = value;
        const set = () => {
          const next = Number(slider.value);
          audioNode.port.postMessage({ type: 'control', index, value: next });
          output.value = next.toFixed(Math.max(0, Math.min(3, String(step).split('.')[1]?.length || 0)));
          output.textContent = output.value;
        };
        slider.addEventListener('input', set);
        row.append(label, output); wrapper.append(row, slider); controls.append(wrapper); set();
      });
    };
    const postToWorklet = (message, transfer = []) => new Promise((resolve, reject) => {
      const requestId = nextWorkletRequestId++;
      workletRequests.set(requestId, { resolve, reject });
      audioNode.port.postMessage({ ...message, requestId }, transfer);
    });
    const ensureAudioWorklet = async () => {
      if (!audioContext) audioContext = new AudioContext();
      if (!workletModuleReady) {
        workletModuleReady = audioContext.audioWorklet.addModule('./audiovm-worklet.js');
      }
      await workletModuleReady;
      if (audioNode) return;
      audioNode = new AudioWorkletNode(audioContext, 'audiovm-processor', {
        numberOfInputs: 0,
        numberOfOutputs: 1,
        outputChannelCount: [outputChannels],
      });
      audioNode.port.onmessage = event => {
        const message = event.data;
        if (message.type === 'status') {
          status.textContent = message.message;
          return;
        }
        if (message.type === 'stats') {
          const cpu = Math.min(100, Math.max(0, message.cpu));
          cpuLoad.textContent = `${cpu.toFixed(cpu < 10 ? 1 : 0)}%`;
          audioFormat.textContent = `${(message.sampleRate / 1000).toFixed(1)} kHz · ${(1000 * message.blockSize / message.sampleRate).toFixed(1)} ms`;
          return;
        }
        const request = workletRequests.get(message.requestId);
        if (request) {
          workletRequests.delete(message.requestId);
          message.type === 'error' ? request.reject(new Error(message.message)) : request.resolve(message);
        }
      };
    };
    const stop = () => {
      if (audioNode && audioConnected) { audioNode.disconnect(); audioConnected = false; }
      if (audioContext) audioContext.suspend();
      audioStats.hidden = true;
      playButton.textContent = 'Play'; playButton.classList.remove('playing');
    };
    const start = async () => {
      if (!processor || !audioNode) return;
      if (!audioConnected) {
        audioNode.connect(audioContext.destination);
        audioConnected = true;
      }
      await audioContext.resume();
      cpuLoad.textContent = '0%';
      audioFormat.textContent = `${(audioContext.sampleRate / 1000).toFixed(1)} kHz · ${(1000 * 128 / audioContext.sampleRate).toFixed(1)} ms`;
      audioStats.hidden = false;
      playButton.textContent = 'Stop'; playButton.classList.add('playing');
    };
    const midiNoteForKey = key => 12 * (baseOctave + 1) + keyboardSemitones.get(key);
    const updatePianoKey = midi => pianoKeys.get(midi)?.classList.toggle('active', [...activeMidiSources.values()].includes(midi));
    const renderPiano = () => {
      const whiteCount = Math.max(17, Math.ceil(piano.clientWidth / 24));
      const firstC = 12 * baseOctave;
      const natural = [0, 2, 4, 5, 7, 9, 11];
      const labels = new Map([...keyboardSemitones].map(([key, semitone]) => [12 * (baseOctave + 1) + semitone, key]));
      piano.style.gridTemplateColumns = `repeat(${whiteCount}, 1fr)`;
      piano.style.setProperty('--white-count', whiteCount);
      piano.replaceChildren(); pianoKeys = new Map();
      for (let index = 0; index < whiteCount; index++) {
        const midi = firstC + 12 * Math.floor(index / 7) + natural[index % 7];
        const octave = Math.floor(midi / 12) - 1;
        const isC = midi % 12 === 0, key = labels.get(midi);
        const white = document.createElement('button');
        white.className = 'piano-key white'; white.style.gridColumn = index + 1; white.dataset.midi = midi;
        white.setAttribute('aria-label', `${isC ? 'C' + octave : 'MIDI ' + midi}${key ? ', ' + key.toUpperCase() + ' key' : ''}`);
        white.innerHTML = `${key ? `<span class="key-label">${key}</span>` : ''}${isC ? `<span class="octave-label">C${octave}</span>` : ''}`;
        piano.append(white); pianoKeys.set(midi, white);
        const next = firstC + 12 * Math.floor((index + 1) / 7) + natural[(index + 1) % 7];
        if (next - midi === 2) {
          const black = document.createElement('button'), blackMidi = midi + 1, blackKey = labels.get(blackMidi);
          black.className = 'piano-key black'; black.style.setProperty('--after', index + 1); black.dataset.midi = blackMidi;
          black.setAttribute('aria-label', `MIDI ${blackMidi}${blackKey ? ', ' + blackKey.toUpperCase() + ' key' : ''}`);
          black.textContent = blackKey || ''; piano.append(black); pianoKeys.set(blackMidi, black);
        }
      }
    };
    const transposeOctave = amount => {
      const next = Math.max(0, Math.min(8, baseOctave + amount));
      if (next === baseOctave) return;
      releaseAllNotes();
      baseOctave = next;
      renderPiano();
    };
    renderPiano();
    new ResizeObserver(renderPiano).observe(piano);
    const sendNoteOn = (source, midi) => {
      if (activeMidiSources.has(source)) return;
      if (!processor) return;
      activeMidiSources.set(source, midi);
      audioNode.port.postMessage({ type: 'midi', status: 0x90, data1: midi, data2: 100 });
      updatePianoKey(midi);
      start().catch(cause => showError(`Could not start audio: ${cause.message}`));
    };
    const sendNoteOff = source => {
      const midi = activeMidiSources.get(source);
      if (midi === undefined) return;
      activeMidiSources.delete(source);
      if (![...activeMidiSources.values()].includes(midi)) {
        audioNode.port.postMessage({ type: 'midi', status: 0x80, data1: midi, data2: 0 });
      }
      updatePianoKey(midi);
    };
    const releaseAllNotes = () => {
      for (const source of activeMidiSources.keys()) sendNoteOff(source);
    };
    rightPanel.addEventListener('pointerdown', event => {
      if (!event.target.closest('.piano-key')) rightPanel.focus();
    });
    piano.addEventListener('pointerdown', event => {
      const pianoKey = event.target.closest('.piano-key');
      if (!pianoKey) return;
      event.preventDefault(); rightPanel.focus(); pianoKey.setPointerCapture(event.pointerId);
      const midi = Number(pianoKey.dataset.midi);
      pointerNotes.set(event.pointerId, midi);
      sendNoteOn(`pointer${event.pointerId}`, midi);
    });
    piano.addEventListener('pointermove', event => {
      if (!pointerNotes.has(event.pointerId)) return;
      const nextMidi = Number(document.elementFromPoint(event.clientX, event.clientY)?.closest('.piano-key')?.dataset.midi);
      const previousMidi = pointerNotes.get(event.pointerId);
      if (nextMidi === previousMidi) return;
      sendNoteOff(`pointer${event.pointerId}`);
      pointerNotes.set(event.pointerId, Number.isFinite(nextMidi) ? nextMidi : null);
      if (Number.isFinite(nextMidi)) sendNoteOn(`pointer${event.pointerId}`, nextMidi);
    });
    for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      piano.addEventListener(eventName, event => {
        if (!pointerNotes.has(event.pointerId)) return;
        pointerNotes.delete(event.pointerId);
        sendNoteOff(`pointer${event.pointerId}`);
      }
      );
    }
    rightPanel.addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      if (key === 'z' || key === 'x') {
        event.preventDefault();
        if (!event.repeat) transposeOctave(key === 'z' ? -1 : 1);
        return;
      }
      if (!keyboardSemitones.has(key) || event.repeat) return;
      event.preventDefault();
      sendNoteOn(`keyboard:${key}`, midiNoteForKey(key));
    });
    rightPanel.addEventListener('keyup', event => {
      const key = event.key.toLowerCase();
      if (!keyboardSemitones.has(key)) return;
      event.preventDefault();
      sendNoteOff(`keyboard:${key}`);
    });
    window.addEventListener('blur', releaseAllNotes);
    const loadPatch = async () => {
      clearError();
      if (!resourcesReady) {
        status.textContent = 'Waiting for AudioVM resources…';
        try { await runtimeReady; }
        catch { return; }
      }
      let parsed;
      try { parsed = JSON.parse(await python.compile(editor.value, message => { status.textContent = message; })); }
      catch (cause) { showError(`Python patch error: ${cause.message}`); status.textContent = 'Python error'; return; }
      try {
        status.textContent = 'Preparing audio worklet…';
        stop();
        releaseAllNotes();
        await ensureAudioWorklet();
        status.textContent = 'Activating audio worklet…';
        if (!audioConnected) {
          audioNode.connect(audioContext.destination);
          audioConnected = true;
        }
        await audioContext.resume();
        status.textContent = 'Sending patch to audio worklet…';
        processor = false;
        const wasmResponse = await fetch('./audiovm.wasm');
        if (!wasmResponse.ok) throw new Error(`Could not load audiovm.wasm (${wasmResponse.status})`);
        const wasmBinary = await wasmResponse.arrayBuffer();
        await postToWorklet({ type: 'load', json: JSON.stringify(parsed), wasmBinary }, [wasmBinary]);
        stop();
        processor = true;
        renderControls(parsed);
        playButton.disabled = false;
        status.textContent = 'Patch loaded';
      } catch (cause) {
        showError(`AudioVM could not load this patch: ${cause.message}`);
        status.textContent = 'Load failed';
      }
    };

    const savePatch = async () => {
      const filename = 'patch.py';
      try {
        if ('showSaveFilePicker' in window) {
          const fileHandle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: 'Python patch', accept: { 'text/x-python': ['.py'] } }],
          });
          const writable = await fileHandle.createWritable();
          await writable.write(editor.value);
          await writable.close();
        } else {
          const blob = new Blob([editor.value], { type: 'text/x-python' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = filename;
          link.click();
          URL.revokeObjectURL(url);
        }
        status.textContent = 'Patch saved';
      } catch (cause) {
        if (cause.name !== 'AbortError') showError(`Could not save patch: ${cause.message}`);
      }
    };

    loadButton.addEventListener('click', loadPatch);
    saveButton.addEventListener('click', savePatch);
    playButton.addEventListener('click', () => {
      if (playButton.classList.contains('playing')) stop();
      else start().catch(cause => showError(`Could not start audio: ${cause.message}`));
    });
    presetSelect.addEventListener('change', async () => {
      if (!presetSelect.value) return;
      try {
        const presetUrl = new URL(presetSelect.value, new URL('./presets/', import.meta.url));
        const response = await fetch(presetUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        editor.value = await response.text();
        updateEditorChrome();
        await loadPatch();
      } catch (cause) {
        showError(`Could not load preset: ${cause.message}`);
      }
    });
    editor.addEventListener('keydown', event => {
      if (event.key === 'Tab') {
        event.preventDefault();
        const indent = '  ';
        const text = editor.value;
        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        if (start === end && !event.shiftKey) {
          editor.setRangeText(indent, start, end, 'end');
        } else {
          const lineStart = text.lastIndexOf('\n', start - 1) + 1;
          const selection = text.slice(lineStart, end);
          if (event.shiftKey) {
            let removedBeforeCursor = 0;
            let removedTotal = 0;
            const unindented = selection.replace(/^ {1,2}/gm, (spaces, offset) => {
              removedTotal += spaces.length;
              if (offset < start - lineStart) removedBeforeCursor += spaces.length;
              return '';
            });
            editor.value = text.slice(0, lineStart) + unindented + text.slice(end);
            editor.selectionStart = Math.max(lineStart, start - removedBeforeCursor);
            editor.selectionEnd = Math.max(editor.selectionStart, end - removedTotal);
          } else {
            const indented = selection.replace(/^/gm, indent);
            const lineCount = selection.split('\n').length;
            editor.value = text.slice(0, lineStart) + indented + text.slice(end);
            editor.selectionStart = start + indent.length;
            editor.selectionEnd = end + indent.length * lineCount;
          }
        }
        updateEditorChrome();
        return;
      }
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); loadPatch(); }
    });
    const runtimeReady = python.prepare(message => { status.textContent = message; })
    .then(() => {
      resourcesReady = true;
      updateActionAvailability();
      status.textContent = 'Ready to load a patch';
    }).catch(cause => {
      showError(`AudioVM runtime failed to load: ${cause.message}`);
      status.textContent = 'Runtime unavailable';
    });
    loadPresets();
  </script>
</body>
</html>
