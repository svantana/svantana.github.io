<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patch Editor</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #fff; color: #111;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; width: 100vw; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 220px; flex-shrink: 0;
    border-right: 1px solid #111;
    display: flex; flex-direction: column;
    background: #fff;
  }
  #sidebar h1 {
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    margin: 0; padding: 14px 14px 10px 14px;
    border-bottom: 1px solid #ccc;
  }
  #moduleList {
    flex: 1; overflow-y: auto; padding: 10px;
  }
  .module-item {
    border: 1px solid #111;
    background: #fff;
    padding: 8px 10px;
    margin-bottom: 8px;
    cursor: grab;
    user-select: none;
  }
  .module-item:active { cursor: grabbing; }
  .module-item .m-name {
    font-size: 13px; font-weight: 600; color: #111;
  }
  .module-item .m-ports {
    font-size: 10px; color: #888; margin-top: 3px; letter-spacing: 0.02em;
  }
  #graphActions {
    display: flex; gap: 8px;
    padding: 0 10px 10px 10px;
  }
  .action-btn {
    flex: 1;
    border: 1px solid #111;
    background: #fff; color: #111;
    font-size: 12px; font-family: inherit;
    padding: 7px 0;
    cursor: pointer;
  }
  .action-btn:hover { background: #111; color: #fff; }
  #legend {
    border-top: 1px solid #ccc;
    padding: 10px 14px 14px 14px;
    font-size: 10.5px; color: #666; line-height: 1.6;
  }
  #legend b { color: #111; }
  #legend .dot { display:inline-block; width:9px; height:9px; border:1.3px solid #111; border-radius:50%; background:#fff; vertical-align:middle; margin-right:4px;}
  #legend .sq  { display:inline-block; width:9px; height:9px; border:1.3px solid #111; background:#fff; vertical-align:middle; margin-right:4px;}

  /* ---------- Canvas area ---------- */
  #canvasWrap {
    flex: 1; position: relative; background: #fff;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Modules</h1>
    <div id="moduleList"></div>
    <div id="graphActions">
      <button id="saveBtn" class="action-btn">Save graph</button>
      <button id="loadBtn" class="action-btn">Load graph</button>
      <input type="file" id="loadInput" accept="application/json" style="display:none">
    </div>
    <div id="legend">
      <div><span class="dot"></span><b>audio</b> port (round)</div>
      <div><span class="sq"></span><b>control</b> port (square)</div>
      <div style="margin-top:6px;">Drag a module onto the board.<br>
      Drag from one port to another to connect.<br>
      Click a module + Delete to remove it.<br>
      Click a cable to remove it.</div>
    </div>
  </div>
  <div id="canvasWrap">
    <canvas id="pcb"></canvas>
  </div>
</div>

<script>
/* =========================================================
   MODULE DEFINITIONS
   ========================================================= */
const moduleDefs = {
  oscillator: { name: "Oscillator", audioInputs: [],              controlInputs: ["freq", "pw"],   audioOutputs: ["out"],           controlOutputs: [] },
  vca:        { name: "VCA",        audioInputs: ["in"],          controlInputs: ["amount"],        audioOutputs: ["out"],           controlOutputs: [] },
  filter:     { name: "Filter",     audioInputs: ["in"],          controlInputs: ["cutoff", "res"], audioOutputs: ["out"],           controlOutputs: [] },
  envelope:   { name: "Envelope",   audioInputs: [],              controlInputs: ["gate"],           audioOutputs: [],                controlOutputs: ["env"] },
  lfo:        { name: "LFO",        audioInputs: [],              controlInputs: ["rate"],           audioOutputs: [],                controlOutputs: ["out"] },
  mixer:      { name: "Mixer",      audioInputs: ["1", "2", "3", "4"], controlInputs: [],           audioOutputs: ["out"],           controlOutputs: [] },
  noise:      { name: "Noise",      audioInputs: [],              controlInputs: [],                 audioOutputs: ["out"],           controlOutputs: [] },
  output:     { name: "Output",     audioInputs: ["left", "right"], controlInputs: [],               audioOutputs: [],                controlOutputs: [] },
  sequencer:  { name: "Sequencer",  audioInputs: [],              controlInputs: ["clock"],          audioOutputs: [],                controlOutputs: ["pitch", "gate"] },
  delay:      { name: "Delay",      audioInputs: ["in"],          controlInputs: ["time", "fdbk"],  audioOutputs: ["out"],           controlOutputs: [] },
  splitter:   { name: "Splitter",   audioInputs: ["in"],          controlInputs: [],                 audioOutputs: ["1", "2", "3"],   controlOutputs: [] },
};

/* =========================================================
   CONSTANTS
   ========================================================= */
const GRID = 20;
const MODULE_H = GRID * 2;     // fixed height: 2 grid cells
const PORT_HIT = 9;            // hit radius for ports
const PORT_R = 5;              // audio port circle radius
const PORT_SQ = 9;             // control port square side
const CABLE_HIT = 6;           // px distance to grab a cable

/* =========================================================
   STATE
   ========================================================= */
let modules = [];      // {id, type, x, y, w, h}
let connections = [];  // {id, kind:'audio'|'control', from:{moduleId,index}, to:{moduleId,index}}
let idCounter = 1;
let selectedModuleId = null;
let dragState = null;      // moving a module
let connectDrag = null;    // drawing a new cable
let mouseX = 0, mouseY = 0;
let hoverPort = null;      // specific port under the mouse
let hoverModule = null;    // module under the mouse, for showing all its port labels

/* =========================================================
   DOM SETUP
   ========================================================= */
const canvas = document.getElementById('pcb');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const moduleListEl = document.getElementById('moduleList');

function buildSidebar() {
  Object.keys(moduleDefs).forEach(key => {
    const def = moduleDefs[key];
    const item = document.createElement('div');
    item.className = 'module-item';
    item.draggable = true;
    item.innerHTML = `<div class="m-name">${def.name}</div>
      <div class="m-ports">A-in ${def.audioInputs.length} · C-in ${def.controlInputs.length} · A-out ${def.audioOutputs.length} · C-out ${def.controlOutputs.length}</div>`;
    item.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', key);
      e.dataTransfer.effectAllowed = 'copy';
    });
    moduleListEl.appendChild(item);
  });
}
buildSidebar();

function resizeCanvas() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  draw();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */
function snap(v) { return Math.round(v / GRID) * GRID; }

function computeModuleWidth(def) {
  // Box spans grid cells [0, W]. Audio ports land at cells 1,2,3,...
  // from the left edge; control ports at W-1, W-2, W-3,... from the
  // right edge. Width grows with however many ports are needed, plus a
  // small gap between the two groups and a floor so the name still fits.
  const nAudio = Math.max(def.audioInputs.length, def.audioOutputs.length);
  const nControl = Math.max(def.controlInputs.length, def.controlOutputs.length);
  const gap = 2;        // grid cells of clearance between the two groups
  const minCells = 6;   // minimum box width, in grid cells
  const cells = Math.max(nAudio + nControl + gap, minCells);
  return cells * GRID;
}

function getPortPositions(mod) {
  const def = moduleDefs[mod.type];
  const cells = mod.w / GRID;
  const audioX = i => mod.x + i * GRID;            // i = 1, 2, 3, ... from the left edge
  const controlX = i => mod.x + (cells - i) * GRID; // i = 1, 2, 3, ... from the right edge

  const audioIn = [], audioOut = [], controlIn = [], controlOut = [];
  def.audioInputs.forEach((n, idx)    => audioIn.push({ x: audioX(idx + 1), y: mod.y, name: n }));
  def.audioOutputs.forEach((n, idx)   => audioOut.push({ x: audioX(idx + 1), y: mod.y + mod.h, name: n }));
  def.controlInputs.forEach((n, idx)  => controlIn.push({ x: controlX(idx + 1), y: mod.y, name: n }));
  def.controlOutputs.forEach((n, idx) => controlOut.push({ x: controlX(idx + 1), y: mod.y + mod.h, name: n }));

  return { audioIn, controlIn, audioOut, controlOut };
}

function getPortCoord(moduleId, kind, dir, index) {
  const mod = modules.find(m => m.id === moduleId);
  if (!mod) return null;
  const pos = getPortPositions(mod);
  const key = kind + (dir === 'out' ? 'Out' : 'In');
  return pos[key][index];
}

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function findModuleAt(x, y) {
  for (let i = modules.length - 1; i >= 0; i--) {
    const m = modules[i];
    if (x >= m.x && x <= m.x + m.w && y >= m.y && y <= m.y + m.h) return m;
  }
  return null;
}

function findPortAt(x, y) {
  for (let i = modules.length - 1; i >= 0; i--) {
    const mod = modules[i];
    const pos = getPortPositions(mod);
    const groups = [
      ['audio', 'in', pos.audioIn], ['control', 'in', pos.controlIn],
      ['audio', 'out', pos.audioOut], ['control', 'out', pos.controlOut],
    ];
    for (const [kind, dir, arr] of groups) {
      for (let idx = 0; idx < arr.length; idx++) {
        const p = arr[idx];
        if (Math.hypot(p.x - x, p.y - y) <= PORT_HIT) {
          return { moduleId: mod.id, kind, dir, index: idx, x: p.x, y: p.y, name: p.name };
        }
      }
    }
  }
  return null;
}

function orthogonalPoints(x1, y1, x2, y2) {
  const stub = GRID;
  // Points just after leaving the output / just before reaching the
  // input. Both stubs point strictly downward (+y) no matter how the
  // two ports are positioned relative to each other.
  const y1s = y1 + stub;
  const y2s = y2 - stub;

  if (y1s <= y2s) {
    // Enough vertical room for a single horizontal jog between the two
    // stubs: down > across > down (2 kinks — 0 visible kinks if the
    // ports already share an x, since the jog collapses to zero width).
    const midY = (y1s + y2s) / 2;
    return [[x1, y1], [x1, midY], [x2, midY], [x2, y2]];
  }

  // Not enough vertical room for a single jog while keeping both
  // downward stubs; detour sideways and back (4 kinks) so the path
  // still leaves and arrives moving straight down.
  const midX = (x1 + x2) / 2;
  return [
    [x1, y1],
    [x1, y1s],
    [midX, y1s],
    [midX, y2s],
    [x2, y2s],
    [x2, y2],
  ];
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
  const dot = A * C + B * D;
  const lenSq = C * C + D * D;
  let t = lenSq !== 0 ? dot / lenSq : -1;
  t = Math.max(0, Math.min(1, t));
  const xx = x1 + t * C, yy = y1 + t * D;
  return Math.hypot(px - xx, py - yy);
}

function findCableNear(x, y) {
  for (const c of connections) {
    const a = getPortCoord(c.from.moduleId, c.kind, 'out', c.from.index);
    const b = getPortCoord(c.to.moduleId, c.kind, 'in', c.to.index);
    if (!a || !b) continue;
    const pts = orthogonalPoints(a.x, a.y, b.x, b.y);
    for (let i = 0; i < pts.length - 1; i++) {
      if (distToSegment(x, y, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]) <= CABLE_HIT) {
        return c;
      }
    }
  }
  return null;
}

/* =========================================================
   DRAWING
   ========================================================= */
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawOrthogonalPath(x1, y1, x2, y2, radius) {
  const pts = orthogonalPoints(x1, y1, x2, y2);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) {
    ctx.arcTo(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], radius);
  }
  ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
  ctx.stroke();
}

function drawGrid() {
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.lineWidth = 1;
  for (let x = 0; x <= w; x += GRID) {
    ctx.strokeStyle = (x % (GRID * 5) === 0) ? '#d8d8d8' : '#eeeeee';
    ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); ctx.stroke();
  }
  for (let y = 0; y <= h; y += GRID) {
    ctx.strokeStyle = (y % (GRID * 5) === 0) ? '#d8d8d8' : '#eeeeee';
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); ctx.stroke();
  }
}

function drawAudioPort(p) {
  ctx.beginPath();
  ctx.arc(p.x, p.y, PORT_R, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = '#111111';
  ctx.stroke();
}

function drawControlPort(p) {
  const s = PORT_SQ;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = '#111111';
  ctx.strokeRect(p.x - s / 2, p.y - s / 2, s, s);
}

function drawModule(mod) {
  const def = moduleDefs[mod.type];
  ctx.fillStyle = 'rgba(17, 17, 17, 0.82)';
  roundRectPath(mod.x, mod.y, mod.w, mod.h, 4);
  ctx.fill();

  if (mod.id === selectedModuleId) {
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#2b7de9';
    roundRectPath(mod.x - 2, mod.y - 2, mod.w + 4, mod.h + 4, 6);
    ctx.stroke();
  }

  ctx.fillStyle = '#ffffff';
  ctx.font = '12px -apple-system, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(def.name, mod.x + mod.w / 2, mod.y + mod.h / 2);

  const pos = getPortPositions(mod);
  pos.audioIn.forEach(drawAudioPort);
  pos.audioOut.forEach(drawAudioPort);
  pos.controlIn.forEach(drawControlPort);
  pos.controlOut.forEach(drawControlPort);
}

function drawConnection(c) {
  const a = getPortCoord(c.from.moduleId, c.kind, 'out', c.from.index);
  const b = getPortCoord(c.to.moduleId, c.kind, 'in', c.to.index);
  if (!a || !b) return;
  ctx.lineWidth = 2;
  if (c.kind === 'audio') {
    ctx.setLineDash([]);
    ctx.strokeStyle = '#111111';
  } else {
    ctx.setLineDash([5, 3]);
    ctx.strokeStyle = '#888888';
  }
  drawOrthogonalPath(a.x, a.y, b.x, b.y, 8);
  ctx.setLineDash([]);
}

function isValidPair(a, b) {
  if (!a || !b) return false;
  if (a.moduleId === b.moduleId) return false;
  if (a.kind !== b.kind) return false;
  if (a.dir === b.dir) return false;
  return true;
}

function collectModulePorts(mod) {
  const pos = getPortPositions(mod);
  const list = [];
  pos.audioIn.forEach((p, i)    => list.push({ ...p, kind: 'audio',   dir: 'in',  index: i, moduleId: mod.id }));
  pos.audioOut.forEach((p, i)   => list.push({ ...p, kind: 'audio',   dir: 'out', index: i, moduleId: mod.id }));
  pos.controlIn.forEach((p, i)  => list.push({ ...p, kind: 'control', dir: 'in',  index: i, moduleId: mod.id }));
  pos.controlOut.forEach((p, i) => list.push({ ...p, kind: 'control', dir: 'out', index: i, moduleId: mod.id }));
  return list;
}

function samePort(a, b) {
  return a && b && a.moduleId === b.moduleId && a.kind === b.kind && a.dir === b.dir && a.index === b.index;
}

function drawPortLabel(port, opacity) {
  if (!port || !port.name) return;
  // inputs: label runs up-and-to-the-right; outputs: down-and-to-the-right.
  const angle = port.dir === 'in' ? Math.atan2(-1, 1) : Math.atan2(1, 1);
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.translate(port.x, port.y);
  ctx.rotate(angle);
  ctx.font = '11px -apple-system, Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.strokeText(port.name, 10, 0);
  ctx.fillStyle = '#111111';
  ctx.fillText(port.name, 10, 0);
  ctx.restore();
}

function draw() {
  drawGrid();
  connections.forEach(drawConnection);

  if (connectDrag) {
    const a = connectDrag.start;
    const hover = findPortAt(mouseX, mouseY);
    const valid = isValidPair(a, hover);
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = valid ? '#2b9e4a' : '#999999';
    drawOrthogonalPath(a.x, a.y, mouseX, mouseY, 8);
    ctx.setLineDash([]);

    if (hover) {
      ctx.beginPath();
      ctx.arc(hover.x, hover.y, 10, 0, Math.PI * 2);
      ctx.strokeStyle = valid ? '#2b9e4a' : '#d9534f';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  modules.forEach(drawModule);

  if (hoverModule && !dragState) {
    collectModulePorts(hoverModule).forEach(p => {
      drawPortLabel(p, samePort(p, hoverPort) ? 1 : 0.35);
    });
  }
}

/* =========================================================
   INTERACTION
   ========================================================= */
function tryConnect(a, b) {
  if (!isValidPair(a, b)) return;
  const from = a.dir === 'out' ? a : b;
  const to = a.dir === 'out' ? b : a;
  // avoid exact duplicate
  const dup = connections.some(c =>
    c.kind === from.kind &&
    c.from.moduleId === from.moduleId && c.from.index === from.index &&
    c.to.moduleId === to.moduleId && c.to.index === to.index
  );
  if (dup) return;
  connections.push({
    id: idCounter++,
    kind: from.kind,
    from: { moduleId: from.moduleId, index: from.index },
    to: { moduleId: to.moduleId, index: to.index },
  });
}

canvas.addEventListener('mousedown', e => {
  const { x, y } = getCanvasCoords(e);
  const port = findPortAt(x, y);
  if (port) {
    connectDrag = { start: port };
    return;
  }
  const mod = findModuleAt(x, y);
  if (mod) {
    selectedModuleId = mod.id;
    dragState = { id: mod.id, offsetX: x - mod.x, offsetY: y - mod.y };
    draw();
    return;
  }
  const cable = findCableNear(x, y);
  if (cable) {
    connections = connections.filter(c => c.id !== cable.id);
    draw();
    return;
  }
  selectedModuleId = null;
  draw();
});

window.addEventListener('mousemove', e => {
  const { x, y } = getCanvasCoords(e);
  mouseX = x; mouseY = y;

  if (dragState) {
    const mod = modules.find(m => m.id === dragState.id);
    mod.x = snap(x - dragState.offsetX);
    mod.y = snap(y - dragState.offsetY);
    draw();
    return;
  }
  if (connectDrag) {
    hoverPort = findPortAt(x, y);
    hoverModule = findModuleAt(x, y);
    draw();
    return;
  }

  const port = findPortAt(x, y);
  hoverPort = port;
  const mod = findModuleAt(x, y);
  hoverModule = mod;
  canvas.style.cursor = port ? 'crosshair' : (mod ? 'move' : 'default');
  draw();
});

window.addEventListener('mouseup', e => {
  const { x, y } = getCanvasCoords(e);
  if (connectDrag) {
    const endPort = findPortAt(x, y);
    if (endPort) tryConnect(connectDrag.start, endPort);
    connectDrag = null;
  }
  dragState = null;
  draw();
});

window.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedModuleId !== null) {
    e.preventDefault();
    modules = modules.filter(m => m.id !== selectedModuleId);
    connections = connections.filter(c =>
      c.from.moduleId !== selectedModuleId && c.to.moduleId !== selectedModuleId);
    selectedModuleId = null;
    draw();
  }
});

/* ---- drag & drop new modules from sidebar ---- */
wrap.addEventListener('dragover', e => e.preventDefault());
wrap.addEventListener('drop', e => {
  e.preventDefault();
  const key = e.dataTransfer.getData('text/plain');
  const def = moduleDefs[key];
  if (!def) return;
  const { x, y } = getCanvasCoords(e);
  const w = computeModuleWidth(def);
  const h = MODULE_H;
  const mod = {
    id: idCounter++,
    type: key,
    x: snap(x - w / 2),
    y: snap(y - h / 2),
    w, h,
  };
  modules.push(mod);
  selectedModuleId = mod.id;
  draw();
});

/* =========================================================
   INITIAL DEMO CONTENT
   ========================================================= */
(function seed() {
  function place(type, gx, gy) {
    const def = moduleDefs[type];
    const w = computeModuleWidth(def);
    const mod = { id: idCounter++, type, x: snap(gx), y: snap(gy), w, h: MODULE_H };
    modules.push(mod);
    return mod;
  }
  const lfo = place('lfo', 60, 60);
  const osc = place('oscillator', 300, 60);
  const filt = place('filter', 300, 220);
  const vca = place('vca', 300, 380);
  const out = place('output', 560, 380);

  connections.push({ id: idCounter++, kind: 'control', from: { moduleId: lfo.id, index: 0 }, to: { moduleId: osc.id, index: 1 } });
  connections.push({ id: idCounter++, kind: 'audio', from: { moduleId: osc.id, index: 0 }, to: { moduleId: filt.id, index: 0 } });
  connections.push({ id: idCounter++, kind: 'audio', from: { moduleId: filt.id, index: 0 }, to: { moduleId: vca.id, index: 0 } });
  connections.push({ id: idCounter++, kind: 'audio', from: { moduleId: vca.id, index: 0 }, to: { moduleId: out.id, index: 0 } });
})();

/* =========================================================
   SAVE / LOAD GRAPH AS JSON
   ========================================================= */

// Serializes the current graph (modules + connections) to a JSON string.
function serializeGraph() {
  const data = {
    version: 1,
    modules: modules.map(m => ({ id: m.id, type: m.type, x: m.x, y: m.y, w: m.w, h: m.h })),
    connections: connections.map(c => ({
      id: c.id,
      kind: c.kind,
      from: { moduleId: c.from.moduleId, index: c.from.index },
      to: { moduleId: c.to.moduleId, index: c.to.index },
    })),
  };
  return JSON.stringify(data, null, 2);
}

// Parses a JSON string (or already-parsed object) and replaces the
// current graph with it. Returns true on success, false on failure.
// Silently drops modules of unknown type and connections that
// reference a module that didn't survive that filtering.
function loadGraph(json) {
  let data;
  try {
    data = typeof json === 'string' ? JSON.parse(json) : json;
  } catch (err) {
    console.error('loadGraph: invalid JSON', err);
    return false;
  }
  if (!data || !Array.isArray(data.modules) || !Array.isArray(data.connections)) {
    console.error('loadGraph: malformed graph data', data);
    return false;
  }

  const newModules = data.modules
    .filter(m => moduleDefs[m.type])
    .map(m => ({
      id: m.id, type: m.type,
      x: snap(m.x), y: snap(m.y),
      w: m.w, h: m.h,
    }));
  const moduleIds = new Set(newModules.map(m => m.id));

  const newConnections = data.connections
    .filter(c => c.from && c.to && moduleIds.has(c.from.moduleId) && moduleIds.has(c.to.moduleId))
    .map(c => ({
      id: c.id,
      kind: c.kind,
      from: { moduleId: c.from.moduleId, index: c.from.index },
      to: { moduleId: c.to.moduleId, index: c.to.index },
    }));

  modules = newModules;
  connections = newConnections;

  const usedIds = [...modules.map(m => m.id), ...connections.map(c => c.id)];
  idCounter = usedIds.length ? Math.max(...usedIds) + 1 : 1;

  selectedModuleId = null;
  hoverPort = null;
  hoverModule = null;
  dragState = null;
  connectDrag = null;
  draw();
  return true;
}

// Triggers a browser download of the current graph as a .json file.
function downloadGraph(filename = 'patch.json') {
  const blob = new Blob([serializeGraph()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Reads a File (e.g. from an <input type="file">) and loads it as a graph.
function loadGraphFromFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    if (!loadGraph(e.target.result)) {
      alert('Could not load that file: not a valid patch graph.');
    }
  };
  reader.onerror = () => alert('Could not read that file.');
  reader.readAsText(file);
}

document.getElementById('saveBtn').addEventListener('click', () => downloadGraph());
document.getElementById('loadBtn').addEventListener('click', () => document.getElementById('loadInput').click());
document.getElementById('loadInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) loadGraphFromFile(file);
  e.target.value = ''; // allow reloading the same filename later
});

draw();
</script>
